    bestInfTime: bestInfTime || 0,
    ...perGame

    ml,

  };
}

function loginTick() {
  let o = null;
  try {
    o = JSON.parse(localStorage.getItem(LOGIN_KEY) || 'null');
  } catch (e) {}
  const d = new Date(),
    today = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  if (o && o.last === today) return {
    streak: o.streak,
    reward: 0
  };
  d.setDate(d.getDate() - 1);
  const yest = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  const streak = o && o.last === yest ? o.streak + 1 : 1,
    reward = LOGIN_REWARDS[(streak - 1) % 7];
  try {
    localStorage.setItem(LOGIN_KEY, JSON.stringify({
      last: today,
      streak
    }));
    localStorage.setItem('theone_ml', String(Number(localStorage.getItem('theone_ml') || '0') + reward));
  } catch (e) {}
  return {
    streak,
    reward
  };
}

function strHash(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}
function mulberry32(seed) {
  let s = seed;
  return function () {
    s |= 0;
    s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
