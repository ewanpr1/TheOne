/* ── High scores ─────────────────────────────────────────── */
const HS_KEY='theone_hs';
const HS_INF_KEY='theone_hs_inf';
function loadHS(){try{return JSON.parse(localStorage.getItem(HS_KEY)||'[]');}catch{return[];}}
function loadHSInf(){try{return JSON.parse(localStorage.getItem(HS_INF_KEY)||'[]');}catch{return[];}}
function saveHS(score,zone,won){
  const hs=loadHS();
  hs.push({score,zone,won:!!won,d:new Date().toLocaleDateString('fr')});
  // wins always win over deaths; tie-broken by score
  hs.sort((a,b)=>(b.won?1:0)-(a.won?1:0)||b.score-a.score);
  localStorage.setItem(HS_KEY,JSON.stringify(hs.slice(0,5)));
  return hs;
}
function saveHSInf(time){
  const hs=loadHSInf();
  hs.push({time,d:new Date().toLocaleDateString('fr')});
  hs.sort((a,b)=>b.time-a.time);
  localStorage.setItem(HS_INF_KEY,JSON.stringify(hs.slice(0,5)));
  return hs;
}function fmtTime(ms){const s=Math.floor(ms/1000),m=Math.floor(s/60),r=s%60;return m+':'+(r<10?'0':'')+r;}
/* ── Records by mode: n = normal, i = infinite, h = hardcore ──
   Normal / hardcore: a win beats everything, then the furthest zone, then the most rivals. Infinite: longest survival. */
const REC2_KEY='theone_rec2';
const modeKeyOf=g=>g.infinite?'i':g.hardcore?'h':'n';
function recCmp(m,a,b){
  if(m==='i')return(b.time||0)-(a.time||0);
  return(b.won?1:0)-(a.won?1:0)||(b.zone||0)-(a.zone||0)||(b.rivals||0)-(a.rivals||0);
}
function loadRec(){
  let r=null;try{r=JSON.parse(localStorage.getItem(REC2_KEY)||'null');}catch(e){}
  if(!r||!r.n){   // first launch after the update: carry the old lists over
    r={n:[],i:[],h:[]};
    loadHS().forEach(h=>r.n.push({won:!!h.won,zone:h.zone||0,rivals:h.score||0,ts:0,d:h.d}));
    loadHSInf().forEach(h=>r.i.push({time:h.time||0,rivals:0,ts:0,d:h.d}));
    ['n','i','h'].forEach(m=>r[m].sort((a,b)=>recCmp(m,a,b)));
  }
  return r;
}
function saveRecRun(m,e){
  const r=loadRec();r[m].push(e);r[m].sort((a,b)=>recCmp(m,a,b));r[m]=r[m].slice(0,5);
  try{localStorage.setItem(REC2_KEY,JSON.stringify(r));}catch(x){}
  return r;
}
const recDate=e=>e.ts?new Date(e.ts).toLocaleDateString(LANG==='fr'?'fr-FR':LANG==='en'?'en-GB':LANG):(e.d||'');

function fmtDuration(ms){
  const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),r=s%60;
  if(h>0)return h+'h '+m+'m';
  if(m>0)return m+'m '+r+'s';
  return r+'s';
}

/* ── Stats ───────────────────────────────────── */
const STATS_KEY='theone_stats';
function loadStats(){
  let s={};
  try{s=JSON.parse(localStorage.getItem(STATS_KEY)||'{}');}catch(e){}
  s=Object.assign({games:0,wins:0,rivals:0,timeNorm:0,timeInf:0},s);
  if(!Array.isArray(s.loss)||s.loss.length!==5)s.loss=[0,0,0,0,0];   // lost games per zone (index 4 = the ovule's membrane)
  if(!s.lossM||!s.lossM.n)s.lossM={n:s.loss.slice(),h:[0,0,0,0,0]};   // same, split by mode (hardcore started empty; older losses count as normal)
  return s;
}
function saveStats(p){localStorage.setItem(STATS_KEY,JSON.stringify(p));return p;}
function recordGame({won,rivals,playT,infinite,helmets,zone,mode}){
  const s=loadStats();
  s.games++;if(won)s.wins++;s.rivals+=rivals||0;
  if(!won&&!infinite){const zi=clamp(zone||0,0,4);s.loss[zi]++;s.lossM[mode==='h'?'h':'n'][zi]++;}
  if(infinite)s.timeInf+=playT||0;else s.timeNorm+=playT||0;
  s.helmets=(s.helmets||0)+(helmets||0);
  // streak
  if(won){s.streak=(s.streak||0)+1;s.bestStreak=Math.max(s.bestStreak||0,s.streak);}
  else s.streak=0;
  // best win time
  if(won&&!infinite){if(!s.bestWinTime||playT<s.bestWinTime)s.bestWinTime=playT;}
  return saveStats(s);
}

function achComplete(a,s){
  const v=a.get(s)||0;
  if(a.fmt==='speed')return s.bestWinTime>0&&s.bestWinTime<=a.target;
  return v>=a.target;
}

function checkAchievements(stats,bestInfTime,perGame={}){
  const s={...stats,bestInfTime:bestInfTime||0,...perGame};
  const ach=loadAch();let ml=loadML();let earned=[];
  for(const a of ACHIEVEMENTS){
    if(!ach.has(a.id)&&achComplete(a,s)){ach.add(a.id);ml+=a.ml;earned.push(a);}
  }
  if(earned.length){
    saveAch(ach);saveML(ml);
    const dd=loadAchDates();earned.forEach(a=>{dd[a.id]=Date.now();});
    try{localStorage.setItem(ACHD_KEY,JSON.stringify(dd));}catch(e){}
  }
  return{ach,ml,earned};
}

/* ── Daily login streak: one reward per day, growing over a 7-day cycle ── */
const LOGIN_KEY='theone_login';
const LOGIN_REWARDS=[5,5,10,10,15,20,50];
function loginTick(){
  let o=null;try{o=JSON.parse(localStorage.getItem(LOGIN_KEY)||'null');}catch(e){}
  const d=new Date(),today=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
  if(o&&o.last===today)return{streak:o.streak,reward:0};
  d.setDate(d.getDate()-1);
  const yest=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
  const streak=(o&&o.last===yest)?o.streak+1:1,reward=LOGIN_REWARDS[Math.min(streak,7)-1];
  try{localStorage.setItem(LOGIN_KEY,JSON.stringify({last:today,streak}));localStorage.setItem('theone_ml',String(Number(localStorage.getItem('theone_ml')||'0')+reward));}catch(e){}
  return{streak,reward};
}

function strHash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function mulberry32(seed){let s=seed;return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function generateDaily(){
  const id=dayId(),seed=strHash(id),rand=mulberry32(seed);
  const won=localStorage.getItem('theone_won')==='1';   // infinite mode and the win-based challenges only exist once the player has won
  const picked=[];
  for(const t of ['easy','medium','hard']){
    const opts=CH_TEMPLATES.filter(c=>{
      if(c.t!==t)return false;
      if(c.id==='zone_h')return !won;
      if(!won&&(c.t==='hard'||c.id==='inf_m'))return false;
      return true;
    });
    const tpl=opts[Math.floor(rand()*opts.length)];
    const k=Math.floor(rand()*tpl.pool.length),target=tpl.pool[k];
    picked.push({id:tpl.id+'_'+t,tplId:tpl.id,t,target,ml:tpl.mls[k],fmt:tpl.fmt(target),completed:false});
  }
  return picked;
}

function loadDaily(){
  try{
    const d=JSON.parse(localStorage.getItem(DAILY_KEY)||'null');
    if(d&&d.date===dayId())return d;
  }catch{}
  const fresh={date:dayId(),ch:generateDaily(),ds:{killsToday:0,helmetsToday:0,timeToday:0,winsToday:0}};
  localStorage.setItem(DAILY_KEY,JSON.stringify(fresh));
  return fresh;
}
function saveDaily(d){localStorage.setItem(DAILY_KEY,JSON.stringify(d));return d;}

/* ── Weekly challenges ─────────────────────────────────── */
const WEEKLY_KEY='theone_weekly';
function weekId(){
  const d=new Date();
  d.setHours(0,0,0,0); // minuit heure locale
  const daysFromMon=(d.getDay()+6)%7; // lundi=0 … dimanche=6
  d.setDate(d.getDate()-daysFromMon); // reculer au lundi de cette semaine
  return Math.floor(d.getTime()/86400000); // numéro du jour = ID stable
}
/* Weekly challenges: one from group a (easy / medium) and one from group b (hard). Reward grows with the target; `tiers` gives the difficulty of each target. */
const WK_TEMPLATES=[
  {id:'wk_time',g:'a',pool:[60,90,140],mls:[150,220,300],tiers:['easy','easy','easy'],fmt:n=>`Jouer ${n} min cette semaine`,key:'timeWeek',mode:'gte',scale:60000},
  {id:'wk_helm',g:'a',pool:[40,70,100],mls:[150,220,300],tiers:['easy','easy','easy'],fmt:n=>`Ramasser ${n} casques cette semaine`,key:'helmetsWeek',mode:'gte'},
  {id:'wk_kill',g:'a',pool:[1000,1600,2400],mls:[250,350,500],tiers:['medium','medium','medium'],fmt:n=>`Éliminer ${n} rivaux cette semaine`,key:'killsWeek',mode:'gte'},
  {id:'wk_zone',g:'a',pool:[3,6,10],mls:[250,350,500],tiers:['medium','medium','medium'],fmt:n=>`Atteindre ${n} fois la zone 5`,key:'zone5Week',mode:'gte'},
  {id:'wk_wins',g:'b',pool:[3,5,8],mls:[250,400,600],tiers:['medium','hard','hard'],fmt:n=>`Gagner ${n} parties cette semaine`,key:'winsWeek',mode:'gte'},
  {id:'wk_inf',g:'b',pool:[180,240,300],mls:[350,500,700],tiers:['hard','hard','hard'],fmt:n=>`Survivre ${Math.floor(n/60)} min en mode infini`,key:'bestInfInGame',mode:'gte',scale:1000},
  {id:'wk_speed',g:'b',pool:[195,185,175],mls:[250,350,450],tiers:['hard','hard','hard'],fmt:n=>`Gagner en moins de ${Math.floor(n/60)}:${(n%60).toString().padStart(2,'0')}`,key:'bestWinInGame',mode:'lte',scale:1000},
];
function generateWeekly(){
  const id=weekId(),seed=strHash('w'+id),rand=mulberry32(seed);
  const won=localStorage.getItem('theone_won')==='1';
  const groups=[WK_TEMPLATES.filter(c=>c.g==='a'),WK_TEMPLATES.filter(c=>c.g==='b'&&(won||c.id==='wk_wins'))];
  const picked=[];
  groups.forEach((grp,i)=>{
    const tpl=grp[Math.floor(rand()*grp.length)];
    const k=Math.floor(rand()*tpl.pool.length),target=tpl.pool[k];
    picked.push({id:tpl.id+'_'+i,tplId:tpl.id,t:tpl.tiers[k],target,ml:tpl.mls[k],fmt:tpl.fmt(target),completed:false});
  });
  return picked;
}
function loadWeekly(){
  try{
    const w=JSON.parse(localStorage.getItem(WEEKLY_KEY)||'null');
    if(w&&w.wid===weekId())return w;
  }catch{}
  const fresh={wid:weekId(),ch:generateWeekly(),ws:{killsWeek:0,helmetsWeek:0,timeWeek:0,winsWeek:0,zone5Week:0}};
  localStorage.setItem(WEEKLY_KEY,JSON.stringify(fresh));
  return fresh;
}
function saveWeekly(w){localStorage.setItem(WEEKLY_KEY,JSON.stringify(w));return w;}
function checkWeekly(w,gameStats){
  w.ws.killsWeek=(w.ws.killsWeek||0)+(gameStats.killsInGame||0);
  w.ws.helmetsWeek=(w.ws.helmetsWeek||0)+(gameStats.helmetsInGame||0);
  w.ws.timeWeek=(w.ws.timeWeek||0)+(gameStats.playT||0);
  if(gameStats.won&&!gameStats.infinite)w.ws.winsWeek=(w.ws.winsWeek||0)+1;
  if((gameStats.bestZoneInGame||0)>=5)w.ws.zone5Week=(w.ws.zone5Week||0)+1;
  const earned=[];let ml=loadML();
  for(const c of w.ch){
    if(c.completed)continue;
    const tpl=WK_TEMPLATES.find(t=>t.id===c.tplId);if(!tpl)continue;
    let val;
    if(tpl.key in w.ws)val=w.ws[tpl.key];
    else val=gameStats[tpl.key]||0;
    const cmp=tpl.scale?c.target*tpl.scale:c.target;
    let ok=false;
    if(tpl.mode==='gte')ok=val>=cmp;
    else if(tpl.mode==='lte')ok=val>0&&val<=cmp;
    if(ok){c.completed=true;ml+=c.ml;earned.push(c);}
  }
  if(earned.length)saveML(ml);
  saveWeekly(w);
  return{w,earned,ml};
}

function checkDaily(d,gameStats){
  // gameStats: {killsInGame, helmetsInGame, perfectWin, noHelmetWin, bestInfInGame, bestWinInGame, bestZoneInGame, won, infinite, playT}
  // Update daily cumulative
  d.ds.killsToday=(d.ds.killsToday||0)+(gameStats.killsInGame||0);
  d.ds.helmetsToday=(d.ds.helmetsToday||0)+(gameStats.helmetsInGame||0);
  d.ds.timeToday=(d.ds.timeToday||0)+(gameStats.playT||0);
  if(gameStats.won&&!gameStats.infinite)d.ds.winsToday=(d.ds.winsToday||0)+1;
  const earned=[];let ml=loadML();
  for(const c of d.ch){
    if(c.completed)continue;
    const tpl=CH_TEMPLATES.find(t=>t.id===c.tplId);if(!tpl)continue;
    let val;
    if(tpl.key in d.ds)val=d.ds[tpl.key];
    else val=gameStats[tpl.key]||0;
    const cmp=tpl.scale?c.target*tpl.scale:c.target;
    let ok=false;
    if(tpl.mode==='gte')ok=val>=cmp;
    else if(tpl.mode==='lte')ok=val>0&&val<=cmp;
    else if(tpl.mode==='eq')ok=val===cmp||val===true;
    if(ok){c.completed=true;ml+=c.ml;earned.push(c);}
  }
  if(earned.length)saveML(ml);
  saveDaily(d);
  return{d,earned,ml};
}
function effZD(g){
  if(g.infinite&&g.zone===4){
    const base=ZONES[3];const m=1+0.05*Math.floor(g.playT/30000);
    const msm=1+0.025*Math.floor(g.playT/30000);
    return{...base,dur:999,
      spd:[base.spd[0]*msm,base.spd[1]*msm],
      ms:[base.ms[0]/msm,base.ms[1]/msm],
      scr:[base.scr[0]*m,base.scr[1]*m]};
  }
  return ZONES[g.zone];
}

/* ── SVG Components ─────────────────────────────────────── */
const f1=v=>Math.round(v*10)/10;
const hrnd=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s);};
// Closed smooth path through points (quadratic curves via midpoints)
function smoothClosed(pts){
  const n=pts.length;const pl=pts[n-1],p0=pts[0];
  let d=`M${f1((pl[0]+p0[0])/2)} ${f1((pl[1]+p0[1])/2)}`;
  for(let i=0;i<n;i++){const p=pts[i],q=pts[(i+1)%n];d+=`Q${f1(p[0])} ${f1(p[1])} ${f1((p[0]+q[0])/2)} ${f1((p[1]+q[1])/2)}`;}
  return d+'Z';
}
function smoothOpen(pts){
  let d=`M${f1(pts[0][0])} ${f1(pts[0][1])}`;
  for(let i=1;i<pts.length-1;i++){const p=pts[i],q=pts[i+1];d+=`Q${f1(p[0])} ${f1(p[1])} ${f1((p[0]+q[0])/2)} ${f1((p[1]+q[1])/2)}`;}
  const l=pts[pts.length-1];return d+`L${f1(l[0])} ${f1(l[1])}`;
}
function blobPts(cx,cy,n,rf){const a=[];for(let i=0;i<n;i++){const t=i/n*Math.PI*2,r=rf(i,t);a.push([cx+Math.cos(t)*r,cy+Math.sin(t)*r]);}return a;}
// Tapered ribbon along a polyline (tails)
function ribbon(pts,w0,w1){
  const n=pts.length,L=[],R=[];
  for(let i=0;i<n;i++){
    const a=pts[Math.max(0,i-1)],b=pts[Math.min(n-1,i+1)];
    let tx=b[0]-a[0],ty=b[1]-a[1];const l=Math.hypot(tx,ty)||1;tx/=l;ty/=l;
    const w=lerp(w0,w1,i/(n-1))/2;
    L.push(`${f1(pts[i][0]-ty*w)} ${f1(pts[i][1]+tx*w)}`);
    R.push(`${f1(pts[i][0]+ty*w)} ${f1(pts[i][1]-tx*w)}`);
  }
  return'M'+L.join('L')+'L'+R.reverse().join('L')+'Z';
}
const polyD=pts=>'M'+pts.map(p=>f1(p[0])+' '+f1(p[1])).join('L');

/* Living tunnel backdrop, split into GPU-composited layers.
   Every layer is painted once (React.memo) and is afterwards only *moved* with a CSS transform by applyLayers():
   the decor costs no SVG repaint and no React diffing while the game runs. */
const BP=640;                                   // vertical period of the repeating decor
const WALL_W=64;                                // width of one wall layer
const WK1=2*Math.PI/BP,WK2=6*Math.PI/BP;        // periodic versions of the old 0.011 / 0.029 wave numbers
const LAYER_EL={};                              // DOM nodes moved by applyLayers()
const setEl=k=>el=>{if(el)LAYER_EL[k]=el;else delete LAYER_EL[k];};

function wallPts(side,amp,ph,base,top,bottom){
  const pts=[];
  for(let u=top;u<=bottom;u+=20){
    const w=base+Math.sin(u*WK1+ph)*amp+Math.sin(u*WK2+ph*2)*amp*0.45;
    pts.push([side<0?w:WALL_W-w,u]);
  }
  return pts;
}
function wallShape(side,pts){
  const edge=side<0?0:WALL_W;
  return smoothOpen(pts)+`L${edge} ${f1(pts[pts.length-1][1])}L${edge} ${f1(pts[0][1])}Z`;
}

const Layers=React.memo(function Layers({acc,vbW,vbH,ox,S,fx}){
  const m=Math.ceil(vbH/BP)+1,H3=m*BP;
  // n circles per period, repeated m times so the layer can scroll seamlessly
  const dots=(n,seed,rMin,rMax,op,fill)=>{
    const out=[];
    for(let c=0;c<m;c++)for(let i=0;i<n;i++){
      const k=seed+i;
      out.push(<circle key={c*64+i} cx={f1(hrnd(k*3+2)*vbW)} cy={f1(hrnd(k*3+1)*BP+c*BP)} r={f1(rMin+hrnd(k*3)*(rMax-rMin))} fill={fill} opacity={op}/>);
    }
    return out;
  };
  const bokeh=(id,n,seed,rMin,rMax,op)=>(
    <svg viewBox={`0 0 ${vbW} ${H3}`} style={{display:'block',width:vbW,height:H3}}>
      <defs><radialGradient id={id}><stop offset="0%" stopColor={acc} stopOpacity="0.55"/><stop offset="50%" stopColor={acc} stopOpacity="0.2"/><stop offset="100%" stopColor={acc} stopOpacity="0"/></radialGradient></defs>
      {dots(n,seed,rMin,rMax,op,`url(#${id})`)}
    </svg>);
  const wallH=vbH+BP+40;
  const wall=(side)=>{
    const id=side<0?'bdWl':'bdWr';
    const back=wallPts(side,9,side<0?1.3:2.1,26,-BP-20,vbH+20),front=wallPts(side,6,side<0?0:3.4,14,-BP-20,vbH+20);
    const x1=side<0?0:WALL_W,x2=side<0?48:WALL_W-48;
    return(
      <svg viewBox={`0 ${-BP-20} ${WALL_W} ${wallH}`} style={{display:'block',width:WALL_W,height:wallH}}>
        <defs><linearGradient id={id} gradientUnits="userSpaceOnUse" x1={x1} y1="0" x2={x2} y2="0">
          <stop offset="0%" stopColor="#000" stopOpacity="0.5"/><stop offset="80%" stopColor={acc} stopOpacity="0.16"/><stop offset="100%" stopColor={acc} stopOpacity="0.4"/>
        </linearGradient></defs>
        <path d={wallShape(side,back)} fill={`url(#${id})`} opacity="0.55"/>
        <path d={wallShape(side,front)} fill={`url(#${id})`}/>
        <path d={smoothOpen(front)} fill="none" stroke={acc} strokeOpacity="0.14" strokeWidth="9"/>
        <path d={smoothOpen(front)} fill="none" stroke={acc} strokeOpacity="0.6" strokeWidth="1.3"/>
      </svg>);
  };
  const lay={position:'absolute',left:0,top:0,willChange:'transform'};
  const rightX=POX+PW+ox;
  return(
    <div ref={setEl('root')} aria-hidden="true" style={{position:'absolute',left:0,top:0,width:vbW,height:vbH,overflow:'hidden',pointerEvents:'none',transformOrigin:'0 0',transform:S!==1?`scale(${S})`:undefined}}>
      {fx<1&&<div ref={setEl('far')} style={lay}>{bokeh('bdBkA',4,100,55,115,0.22)}</div>}
      {fx<1&&<div ref={setEl('near')} style={lay}>{bokeh('bdBkB',6,200,9,22,0.38)}</div>}
      <div ref={setEl('wallL')} style={lay}>{wall(-1)}</div>
      <div ref={setEl('wallR')} style={lay}>{wall(1)}</div>
      {fx<1&&<div ref={setEl('spk')} style={lay}>
        <svg viewBox={`0 0 ${vbW} ${H3}`} style={{display:'block',width:vbW,height:H3}}>{dots(10,300,0.8,2.2,0.5,'#ffe9e2')}</svg>
      </div>}
      {/* Darkening outside the play lane (desktop windows wider than the lane); faded out while the canal is window-wide */}
      {POX+ox>0&&<div ref={setEl('sideL')} style={{position:'absolute',left:0,top:0,width:POX+ox,height:vbH,background:'rgba(0,0,0,0.45)'}}/>}
      {POX+ox>0&&<div ref={setEl('sideR')} style={{position:'absolute',left:rightX,top:0,width:Math.max(0,vbW-rightX),height:vbH,background:'rgba(0,0,0,0.45)'}}/>}
      <div style={{position:'absolute',left:0,top:0,width:'100%',height:'100%',background:'radial-gradient(ellipse 75% 75% at 50% 50%,rgba(0,0,0,0) 50%,rgba(0,0,0,0.72) 100%)'}}/>
    </div>);
});

/* Smug winner shown on the "Éliminé" screen — half-lidded side glance, raised brow, lopsided smirk */
function RivalVictor({wob}){
  const t=wob*0.04;

  for(let i=0;i<=22;i++){const f=i/22;pts.push([Math.sin(wob*0.11+f*3.4)*f*13,14+f*104]);}
  const SKIN='#f59c7c',LID='#e8866a',INK='#6e0f2e';
  // eye: lidTop = y of the eyelid edge at the outer/inner corner (local coords)

    const id='rvEye'+side;

      <clipPath id={id}><ellipse cx={cx} cy="0" rx="6.6" ry="7.4"/></clipPath>
      <ellipse cx={cx} cy="0" rx="6.6" ry="7.4" fill="url(#eyeWhite)"/>
      <g clipPath={`url(#${id})`}>

        <circle cx={cx-2+look} cy="2.9" r="2.3" fill="#2a0012"/>
        <circle cx={cx-0.6+look} cy="1.2" r="1.3" fill="#fff"/>
        <path d={`M ${ox} ${lo} L ${ix} ${li} L ${ix} -9 L ${ox} -9 Z`} fill={LID}/>
        <path d={`M ${ox} ${lo} L ${ix} ${li} L ${ix} ${li+1.6} L ${ox} ${lo+1.6} Z`} fill="#000" opacity="0.12"/>

  return(
    <g transform={`translate(0,${bob}) rotate(${tilt})`}>

        <path d={ribbon(pts,10,1.2)} fill="#f7a0b4"/>

      {/* Cheeks — the right one pushed up by the smirk */}
      <ellipse cx="-14" cy="10" rx="5.5" ry="3.2" fill="#e8506e" opacity="0.28"/>
      <ellipse cx="14.5" cy="7.5" rx="6" ry="3.6" fill="#e8506e" opacity="0.38"/>
      {/* Eyes: heavy lids, glancing down-left at the loser */}

        {eye(-9,-1,-2.2,-0.8)}

      {/* Brows: left low & flat, right arched up */}
      <path d="M -17 -12.5 Q -10 -14.5 -3.5 -11.5" stroke={INK} strokeWidth="2.3" fill="none" strokeLinecap="round"/>
      <path d={`M 3.5 ${-14-brow} Q 10 ${-20.5-brow} 17 ${-15.5-brow*0.6}`} stroke={INK} strokeWidth="2.3" fill="none" strokeLinecap="round"/>
      {/* Lopsided smirk */}
      <path d="M -6.5 11 Q 1.5 13.6 9.5 7.2" stroke={INK} strokeWidth="2.3" fill="none" strokeLinecap="round"/>

      {/* Specular */}
      <ellipse cx="-6" cy="-20" rx="6" ry="2.8" fill="#fff" opacity="0.75" transform="rotate(-24,-6,-20)"/>

/* ── Baked sprites ──
   The static artwork of the busiest objects is rasterised once into a bitmap (see bakeSprites) and drawn as an <image>,
   so every frame the browser blits a texture instead of re-shading gradients. Until a sprite is ready (or if baking fails)
   the *Vec components below draw the very same art as live vectors. */
const SPR={};
function Img({k,x,y,sx=1,sy=1,rot=0,op}){
  const s=SPR[k];
  const tf=`translate(${f1(x)},${f1(y)})`+(rot?` rotate(${f1(rot)})`:'')+(sx!==1||sy!==1?` scale(${sx.toFixed(3)},${sy.toFixed(3)})`:'');
  return<image href={s.href} xlinkHref={s.href} x={-s.cx} y={-s.cy} width={s.w} height={s.h} transform={tf} opacity={op}/>;
}

/* White blood cells — three body shapes (round / oval / lobed) with matching nuclei */
function WBCVec({x,y,pulse,v=0}){
  const r=27+Math.sin(pulse*0.09)*2;
  const wob=(i)=>Math.sin(pulse*0.07+i*2.1)*2.2+Math.sin(pulse*0.035+i*0.9)*1.6;
  // Three body outlines (round / oval / bean). Eyes, dots and nuclei are identical for all of them.
  const rf=v===1?(i,t)=>1/Math.sqrt((Math.cos(t)/(r+4))**2+(Math.sin(t)/(r-3))**2)+wob(i)*0.5
        :v===2?(i,t)=>r*(1-0.17*Math.exp(-((t-Math.PI/2)**2)/0.3))+wob(i)*0.5
        :(i)=>r+wob(i);
  const mem=smoothClosed(blobPts(x,y,v===0?14:20,rf));
  const nr=pulse*0.012;
  return(
    <g>
      <circle cx={x} cy={y} r={r+18} fill="url(#glowIce)" opacity="0.5"/>
      <path d={mem} transform="translate(0,4)" fill="#000" opacity="0.22"/>
      <path d={mem} fill="url(#wbcBody)" stroke="#fff" strokeOpacity="0.85" strokeWidth="1.4"/>
      {[0,1,2,3,4,5,6,7].map(i=>{const a=i*0.83+pulse*0.004,d=9+(i%3)*5.5;
        return<circle key={i} cx={f1(x+Math.cos(a)*d)} cy={f1(y+Math.sin(a)*d)} r={1.1+(i%2)*0.5} fill="#8fa6d8" opacity="0.5"/>;
      })}
      {[0,1,2].map(i=>{const a=nr+i*2.1;
        return<circle key={i} cx={f1(x+1+Math.cos(a)*5)} cy={f1(y+7+Math.sin(a)*3.5)} r="6.4" fill="url(#wbcNuc)"/>;
      })}
      <ellipse cx={x-1.5} cy={y+4.5} rx="2.8" ry="1.4" fill="#fff" opacity="0.45"/>
      <path d={`M ${x-11.5} ${y-10.5} Q ${x-6.5} ${y-13} ${x-2.5} ${y-7.5} Q ${x-7.5} ${y-5.5} ${x-11.5} ${y-10.5} Z`} fill="#1c1442"/>
      <path d={`M ${x+11.5} ${y-10.5} Q ${x+6.5} ${y-13} ${x+2.5} ${y-7.5} Q ${x+7.5} ${y-5.5} ${x+11.5} ${y-10.5} Z`} fill="#1c1442"/>
      <circle cx={x-5.8} cy={y-9.6} r="0.9" fill="#fff"/>
      <circle cx={x+7.2} cy={y-9.6} r="0.9" fill="#fff"/>
      <ellipse cx={x-9} cy={y-16} rx="7.5" ry="3.4" fill="#fff" opacity="0.75" transform={`rotate(-30,${x-9},${y-16})`}/>
    </g>
  );
}
function WBC(p){

/* Mucus — three smooth shapes: 0 = round drop (original), 1 = asymmetric drop, 2 = tilted egg */
const MUCUS_BUBBLES=[
  [[-0.34,0.2,0.2],[0.32,0.28,0.12],[0.06,-0.08,0.08],[-0.05,0.52,0.07]],
  [[-0.28,0.2,0.2],[0.3,0.28,0.12],[0.05,-0.25,0.08],[-0.1,0.5,0.07]],
  [[-0.28,0.22,0.2],[0.26,0.3,0.12],[0.08,-0.15,0.08],[0.1,-0.55,0.06]],

const MUCUS_DRIP_X=[0.18,0.12,0.2];
function MucusVec({x,y,pulse,r,v=0}){
  const w1=Math.sin(pulse*0.08)*3;
  const base=(i)=>(i%2?w1:-w1)*0.5+Math.sin(pulse*0.05+i*1.9)*3;
  // t = angle (y points down); radius functions are low-order curves so the outline stays smooth
  const rt=v===1?(t)=>r*(1+0.09*Math.cos(2*t+0.7)+0.06*Math.cos(3*t-0.3)+0.06*Math.cos(t+Math.PI/2))
          :v===2?(t)=>r*(0.97+0.12*Math.cos(t+Math.PI/2+0.45)+0.05*Math.cos(2*t+0.9))
          :null;
  const blob=smoothClosed(blobPts(x,y,v===0?10:40,(i,t)=>rt?rt(t):r+base(i)));
  const bottom=rt?rt(Math.PI/2):r*0.95;
  const drip=Math.sin(pulse*0.04)*0.5+0.5;
  return(
    <g>
      <circle cx={x} cy={y} r={r+16} fill="url(#glowLime)" opacity="0.4"/>
      <ellipse cx={x+r*MUCUS_DRIP_X[v]} cy={y+(rt?bottom*0.97:r*0.92)+drip*(rt?5:5)} rx={2.6+drip} ry={3.6+drip*2} fill="#a6dc3a" opacity="0.7"/>
      <path d={blob} fill="url(#mucusBody)" stroke="#d8fa7a" strokeOpacity="0.75" strokeWidth="1.3"/>
      {MUCUS_BUBBLES[v].map(([bx,by,br],i)=>(
        <g key={i}>
          <circle cx={f1(x+bx*r+Math.sin(pulse*0.03+i)*1.5)} cy={f1(y+by*r)} r={f1(br*r)} fill="#fff" fillOpacity="0.08" stroke="#fff" strokeOpacity="0.45" strokeWidth="0.9"/>
          <circle cx={f1(x+bx*r-br*r*0.35)} cy={f1(y+by*r-br*r*0.35)} r={f1(br*r*0.22)} fill="#fff" opacity="0.7"/>

    </g>
  );
}
function Mucus(p){

function arcPath(r,startA,endA){
  const x1=Math.cos(startA)*r,y1=Math.sin(startA)*r;
  const x2=Math.cos(endA)*r,y2=Math.sin(endA)*r;
  const sweep=((endA-startA)+Math.PI*4)%(Math.PI*2);
  return`M ${x1} ${y1} A ${r} ${r} 0 ${sweep>Math.PI?1:0} 1 ${x2} ${y2}`;
}
/* Ovule = glow + shell (corona + zona, rotates with the entry) + core (cytoplasm, nucleus, highlight — fixed light) + entry portal */
const OV_GAP=Math.PI/3.2,OV_GAP_HC=Math.PI/3.6;   // half-opening of the ovule (hardcore is a bit tighter)
function OvuleShell({angle,pulse,gap=OV_GAP}){

        return<circle key={i} cx={f1(Math.cos(a)*rr)} cy={f1(Math.sin(a)*rr)} r={6+(i*7%3)} fill="url(#corona)"/>;
      })}
      <path d={arcPath(54,a0,a1)} fill="none" stroke="#ffe8b0" strokeOpacity="0.3" strokeWidth="11" strokeLinecap="round"/>
      <path d={arcPath(59.5,a0,a1)} fill="none" stroke="#fff4d6" strokeOpacity="0.8" strokeWidth="1.3" strokeLinecap="round"/>

// Rasterises every sprite once (one per timer tick so the main thread is never blocked for long)
function bakeSprites(){

  const keys=Object.keys(SPR_DEFS).sort((a,b)=>(a.startsWith("ov")?1:0)-(b.startsWith("ov")?1:0));let i=0;   // big ovule sprites last
  const next=()=>{
    if(i>=keys.length)return;
    const k=keys[i++],d=SPR_DEFS[k];
    try{
      const host=document.createElement('div');const root=ReactDOM.createRoot(host);
      ReactDOM.flushSync(()=>root.render(
        <svg xmlns="http://www.w3.org/2000/svg" width={d.w} height={d.h} viewBox={`${-d.cx} ${-d.cy} ${d.w} ${d.h}`}>
          <defs><FxDefs acc="#ffd06b"/></defs>{d.el()}
        </svg>));
      const markup=host.innerHTML;root.unmount();
      const im=new Image();
      im.onload=()=>{
        try{
          const c=document.createElement('canvas');c.width=Math.round(d.w*SS);c.height=Math.round(d.h*SS);
          c.getContext('2d').drawImage(im,0,0,c.width,c.height);
          SPR[k]={href:c.toDataURL('image/png'),w:d.w,h:d.h,cx:d.cx,cy:d.cy};
        }catch(e){}
        setTimeout(next,0);
      };
      im.onerror=()=>setTimeout(next,0);
      im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(markup);
    }catch(e){setTimeout(next,0);}
  };
  next();
}

// Animation clock + visibility for previews (only runs while the preview is on screen)
function useClock(ref,speed){
  const [vis,setVis]=React.useState(true);
  const [w,setW]=React.useState(()=>Math.random()*60);
  React.useEffect(()=>{
    const el=ref.current;if(!el||!('IntersectionObserver' in window))return;
    const io=new IntersectionObserver(es=>setVis(es[es.length-1].isIntersecting),{threshold:0.01});
    io.observe(el);return()=>io.disconnect();
  },[]);
  React.useEffect(()=>{
    if(!vis)return;
    let r,last=performance.now();
    const f=n=>{const dt=Math.min(n-last,50);last=n;setW(v=>v+dt*speed);r=requestAnimationFrame(f);};
    r=requestAnimationFrame(f);return()=>cancelAnimationFrame(r);
  },[vis]);
  return[w,vis];
}

/* ── Fertilization cinematic (plays between touching the ovule's entry and the victory screen) ──
   0.3-2.4 s  the sperm swims up to the entry     2.4-3.6 s  it slips through the membrane, its tail drops away
   3.6-4.9 s  the head reaches the nucleus        4.5-5.6 s  the two nuclei merge in a burst of light
   5.2-6.6 s  the zygote divides in two           5.4 s →    title                                   */
const FERT_DUR=7.4;
function FertScene({t,W,H,ox,oy,skin,onSkip}){
  const cx=W/2,cy=H*0.4,S=Math.min(2.05,W*0.44/84);
  const ease=x=>x<=0?0:x>=1?1:x*x*(3-2*x);
  const seg=(a,b)=>clamp((t-a)/(b-a),0,1);
  const fade=ease(seg(0,0.5));
  const A=ease(seg(0.3,2.4)),B=ease(seg(2.4,3.6)),C=ease(seg(3.6,4.9));
  const portalY=cy+58*S,inY=cy+24*S,nucX=cx+9*S,nucY=cy-4*S,startY=H+80;
  let sx=cx,sy=startY+(portalY-startY)*A,tailK=1,scl=1;
  if(t>=2.4&&t<3.6){sy=portalY+(inY-portalY)*B;tailK=1-0.85*B;scl=1-0.1*B;}
  else if(t>=3.6){sx=cx+(nucX-cx)*C;sy=inY+(nucY-inY)*C;tailK=0.15*(1-C);scl=0.9-0.45*C;}
  const sOp=t<4.4?1:1-ease(seg(4.4,4.95));
  const merge=ease(seg(4.5,5.2)),flashT=seg(4.55,5.7);
  const div=ease(seg(5.2,6.6));
  const pulse=t*4;
  const showSperm=sOp>0.01;
  const ring=(t0,i)=>{const k=seg(t0+i*0.22,t0+i*0.22+1.1);if(k<=0||k>=1)return null;
    return<circle key={i} cx={cx} cy={portalY} r={8+k*52*S*0.5} fill="none" stroke="#fff" strokeOpacity={(1-k)*0.8} strokeWidth={2.2*(1-k)+0.4}/>;};
  const nucPulse=1+0.32*Math.sin(clamp((t-4.5)/1.2,0,1)*Math.PI)*(t>4.5?1:0);
  return(
    <g>
      <g transform={`translate(${-ox},${-oy})`}>
        <rect x="0" y="0" width={W} height={H} fill="#0c0602" opacity={fade}/>
        <rect x="0" y="0" width={W} height={H} fill="url(#fertBg)" opacity={fade}/>
        <g opacity={fade}>
          {/* slow rays */}
          <g transform={`translate(${cx},${cy}) rotate(${(t*6)%360})`}>{Array.from({length:12},(_,i)=><path key={i} d="M -9 -60 L 0 -300 L 9 -60 Z" fill="#ffd25e" opacity="0.06" transform={`rotate(${i*30})`}/>)}</g>
          <g transform={`translate(${cx},${cy}) scale(${S})`}>
            <circle cx="0" cy="0" r={125+Math.sin(pulse*0.5)*6} fill="url(#glowGold)" opacity={0.55+0.3*merge}/>
            <OvuleShell angle={Math.PI/2} pulse={t*50}/>
            {div<=0.01&&<OvuleCore/>}
            {/* merging nuclei glow */}
            {div<=0.01&&<g>
              <circle cx="9" cy="-4" r={13*nucPulse} fill="url(#ovNuc)"/>
              <circle cx="9" cy="-4" r={30*merge*nucPulse} fill="url(#glowGold)" opacity={0.7*(1-ease(seg(5.3,5.9)))}/>
            </g>}
            {/* zygote division */}
            {div>0.01&&<g>
              {[-1,1].map(s=>(
                <g key={s} transform={`translate(${s*div*23},0) scale(${0.76-0.05*div})`}>
                  <circle r="46" fill="url(#ovCyto)"/>
                  <circle cx={s*-4} cy="-3" r="11" fill="url(#ovNuc)"/>
                  <ellipse cx="-17" cy="-23" rx="14" ry="5.5" fill="#fff" opacity="0.6" transform="rotate(-38,-17,-23)"/>
                </g>))}
              <ellipse cx="0" cy="0" rx={Math.max(0.01,14*(1-div)+3)} ry="22" fill="url(#ovCyto)" opacity={1-div*0.4}/>
            </g>}
            <OvulePortal angle={Math.PI/2} pulse={t*50}/>
          </g>
          {/* ripples where the sperm crosses the membrane */}
          {[0,1,2].map(i=>ring(2.2,i))}
          {/* the sperm */}
          {showSperm&&<g opacity={sOp} transform={`translate(${f1(sx)},${f1(sy)}) scale(${scl.toFixed(3)})`}>
            <SpermPlayer x={0} y={0} wob={t*60} hit={false} shield={false} tilt={0} skin={skin} tailK={tailK}/>
          </g>}
          {/* burst of light at the moment of fusion */}
          {flashT>0&&flashT<1&&<g>
            <circle cx={nucX} cy={nucY} r={flashT*150*S/2} fill="url(#glowWhite)" opacity={(1-flashT)*0.95}/>
            {Array.from({length:14},(_,i)=>{const a=i/14*Math.PI*2,r=flashT*95*S/2+8;
              return<path key={i} d="M 0 -5 Q 0.6 -0.6 5 0 Q 0.6 0.6 0 5 Q -0.6 0.6 -5 0 Q -0.6 -0.6 0 -5 Z" fill="#fff" opacity={(1-flashT)}
                transform={`translate(${f1(nucX+Math.cos(a)*r)},${f1(nucY+Math.sin(a)*r)}) scale(${(1.3-flashT*0.6).toFixed(2)})`}/>;})}
          </g>}
          {/* title */}
          {t>5.4&&<g opacity={ease(seg(5.4,6.2))}>
            <text x={cx} y={H*0.775} textAnchor="middle" fill="url(#goldText)" fontSize="34" fontWeight="800" letterSpacing="-1" fontFamily="Sora,Helvetica Neue,Arial">{tr('Fécondation !')}</text>
          </g>}
          {t>5.9&&<text x={cx} y={H*0.775+26} textAnchor="middle" fill="rgba(255,230,170,0.75)" fontSize="13" fontWeight="600" fontFamily="Sora,Helvetica Neue,Arial" opacity={ease(seg(5.9,6.7))}>{tr('Une nouvelle vie commence…')}</text>}
          {t>1&&t<6.6&&<text x={cx} y={H-34} textAnchor="middle" fill="rgba(255,235,215,0.4)" fontSize="10.5" fontWeight="600" letterSpacing="1" fontFamily="Sora,Helvetica Neue,Arial">{tr('Touche pour passer')}</text>}
        </g>
        <rect x="0" y="0" width={W} height={H} fill="transparent" onClick={()=>{if(t>0.8)onSkip();}} style={{cursor:'pointer'}}/>
      </g>
    </g>
  );
}

function achProg(a,s){
  const val=a.get(s)||0;let p=clamp(val/a.target,0,1),txt;
  if(a.fmt==='time')txt=`${fmtDuration(val)} / ${fmtDuration(a.target)}`;

  return{p,txt};

function HFadeScroll({children,style}){
  const ref=React.useRef(null);
  const [f,setF]=React.useState({l:false,r:false});
  const upd=React.useCallback(()=>{
    const el=ref.current;if(!el)return;
    const l=el.scrollLeft>4,r=el.scrollLeft+el.clientWidth<el.scrollWidth-4;

  },[]);

/* Scrolling body of a window: its edges dissolve into a soft fade, but only on the side where content is actually hidden */
function FadeScroll({children,style}){
  const ref=React.useRef(null);

  const upd=React.useCallback(()=>{
    const el=ref.current;if(!el)return;
    const t=el.scrollTop>4,b=el.scrollTop+el.clientHeight<el.scrollHeight-4;
    setF(s=>s.t===t&&s.b===b?s:{t,b});
  },[]);
  React.useEffect(()=>{
    upd();const el=ref.current;let ro;
    if(window.ResizeObserver&&el){ro=new ResizeObserver(upd);ro.observe(el);Array.from(el.children).forEach(c=>ro.observe(c));}
    return()=>{if(ro)ro.disconnect();};
  },[]);
  React.useEffect(upd);
  const mask=`linear-gradient(to bottom,rgba(0,0,0,${f.t?0:1}) 0,#000 ${f.t?24:0}px,#000 calc(100% - ${f.b?24:0}px),rgba(0,0,0,${f.b?0:1}) 100%)`;
  return<div ref={ref} onScroll={upd} className="ui-scroll" style={{...style,WebkitMaskImage:mask,maskImage:mask}}>{children}</div>;
}

function fmtCountdown(ms){
  const m=Math.max(0,Math.floor(ms/60000)),d=Math.floor(m/1440),h=Math.floor((m%1440)/60),mi=m%60;
  return d>0?`${d} j ${h} h`:(h>0?`${h} h ${mi<10?'0':''}${mi}`:`${mi} min`);
}
function msToMidnight(){const n=new Date(),t=new Date(n);t.setHours(24,0,0,0);return t-n;}
function msToMonday(){const n=new Date(),t=new Date(n);t.setHours(0,0,0,0);const d=(8-(n.getDay()||7))%7||7;t.setDate(t.getDate()+d);return t-n;}
function progressOf(tpl,state,c){
  if(!tpl||!(tpl.key in state))return null;
  const val=state[tpl.key]||0,target=tpl.scale?c.target*tpl.scale:c.target;
  return{p:clamp(val/target,0,1),txt:tpl.scale?`${fmtDuration(val)} / ${fmtDuration(target)}`:`${val} / ${c.target}`};
}

function Game(){
  const [safeArea,setSafeArea]=React.useState({sat:0,sab:0});
  const safeAreaRef=React.useRef({sat:0,sab:0});
  React.useEffect(()=>{
    const el=document.createElement('div');

    const t=setTimeout(()=>{
      const el2=document.createElement('div');
      el2.style.cssText='position:fixed;top:0;left:0;width:0;height:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);pointer-events:none;visibility:hidden';
      document.body.appendChild(el2);
      const cs2=getComputedStyle(el2);
      const sat2=parseFloat(cs2.paddingTop)||0;
      const sab2=parseFloat(cs2.paddingBottom)||0;
      document.body.removeChild(el2);
      setSafeArea({sat:sat2,sab:sab2});safeAreaRef.current={sat:sat2,sab:sab2};
    },200);
    return()=>clearTimeout(t);
  },[]);
  const SAT=safeArea.sat;
  const SAB=safeArea.sab;
  const [screen,setScreen]=React.useState('start');
  const screenRef=React.useRef('start');
  const [highScores,setHighScores]=React.useState(loadHS);
  const [highScoresInf,setHighScoresInf]=React.useState(loadHSInf);
  const [infiniteUnlocked,setInfiniteUnlocked]=React.useState(()=>localStorage.getItem('theone_won')==='1');
  const [discreteMode,setDiscreteMode]=React.useState(()=>localStorage.getItem('theone_discrete')==='1');
  DISCRETE_MODE=discreteMode;
  const [muted,setMuted]=React.useState(()=>localStorage.getItem('theone_muted')==='1');
  const [rec,setRec]=React.useState(loadRec);
  const [mode,setModeS]=React.useState(()=>{const m=localStorage.getItem(MODE_KEY);return m==='h'?'h':(m==='i'&&localStorage.getItem('theone_won')==='1')?'i':'n';});
  const [showQuick,setShowQuick]=React.useState(false);
  const [showEarn,setShowEarn]=React.useState(false);
  const [showMode,setShowMode]=React.useState(false);
  const [showStreak,setShowStreak]=React.useState(false);
  const [showHow,setShowHow]=React.useState(()=>localStorage.getItem(TUTO_KEY)!=='1');
  const [loginToast,setLoginToast]=React.useState(LOGIN0.reward>0?LOGIN0:null);
  const [shareImg,setShareImg]=React.useState(null);
  const [showInfo,setShowInfo]=React.useState(false);
  const [showSettings,setShowSettings]=React.useState(false);
  const [showStats,setShowStats]=React.useState(false);
  const [showAch,setShowAch]=React.useState(false);
  const [showShop,setShowShop]=React.useState(false);
  const [owned,setOwned]=React.useState(loadOwned);
  const [equipped,setEquipped]=React.useState(loadSkin);
  const equippedRef=React.useRef(equipped);
  React.useEffect(()=>{equippedRef.current=equipped;},[equipped]);
  const [stats,setStats]=React.useState(loadStats);
  const [achSet,setAchSet]=React.useState(loadAch);
  const [mL,setML]=React.useState(loadML);
  const [achToast,setAchToast]=React.useState(null);
  const [daily,setDaily]=React.useState(loadDaily);
  const [weekly,setWeekly]=React.useState(loadWeekly);
  const [showDaily,setShowDaily]=React.useState(false);
  const [dailyToast,setDailyToast]=React.useState(null);
  const [,re]=React.useReducer(n=>n+1,0);
  const svgRef=React.useRef(null);
  const divRef=React.useRef(null);
  const vpRef=React.useRef({ox:0,oy:0,vbW:GW,vbH:GH});
  const raf=React.useRef(null);
  const touch=React.useRef(false);
  const gs=React.useRef(initState());

  // First-run tutorial (null = hidden) — the game loop is frozen while it shows
  const [tuto,setTuto]=React.useState(null);
  const tutoRef=React.useRef(null);
  function nextTuto(){
    const n=tutoRef.current+1;
    if(n>=TUTO_STEPS){localStorage.setItem(TUTO_KEY,'1');tutoRef.current=null;setTuto(null);}
    else{tutoRef.current=n;setTuto(n);}
  }
  // ── Pause (button, automatic when the app goes to the background, 3-2-1 before resuming) ──
  const [paused,setPaused]=React.useState(false);
  const pausedRef=React.useRef(false);
  const [countdown,setCountdown]=React.useState(0);
  const cdTimer=React.useRef(null);
  function pauseGame(){
    if(gs.current.phase!=='playing'||tutoRef.current!==null||pausedRef.current)return;
    pausedRef.current=true;setPaused(true);setCountdown(0);touch.current=false;
    if(_ambient)_ambient.pause();
  }
  function resumeGame(){
    if(cdTimer.current)return;
    let c=3;setCountdown(c);
    cdTimer.current=setInterval(()=>{
      c--;
      if(c<=0){
        clearInterval(cdTimer.current);cdTimer.current=null;
        setCountdown(0);pausedRef.current=false;setPaused(false);
        if(_ambient&&!_muted)_ambient.play();
      }else setCountdown(c);
    },750);
  }
  function leaveRun(restart){
    if(cdTimer.current){clearInterval(cdTimer.current);cdTimer.current=null;}
    pausedRef.current=false;setPaused(false);setCountdown(0);
    if(restart){const g=gs.current;startGame(g.infinite,g.hardcore);}
    else setScreenBoth('start');
  }
  React.useEffect(()=>{
    const h=()=>{if(document.hidden)pauseGame();};
    document.addEventListener('visibilitychange',h);window.addEventListener('blur',h);
    return()=>{document.removeEventListener('visibilitychange',h);window.removeEventListener('blur',h);};
  },[]);

  // Landscape is not supported on phones: show a "rotate" screen and freeze the game
  const LAND_MQ='(orientation: landscape) and (pointer: coarse)';
  const [landscape,setLandscape]=React.useState(()=>window.matchMedia(LAND_MQ).matches);
  const landRef=React.useRef(landscape);
  React.useEffect(()=>{
    const mq=window.matchMedia(LAND_MQ);
    const h=()=>{
      landRef.current=mq.matches;setLandscape(mq.matches);
      // Layout constants are measured once at load: if we booted in landscape, reload once back in portrait
      if(!mq.matches&&GW>GH)location.reload();
    };
    mq.addEventListener?mq.addEventListener('change',h):mq.addListener(h);
    try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('portrait').catch(()=>{});}catch(e){}
    return()=>{mq.removeEventListener?mq.removeEventListener('change',h):mq.removeListener(h);};
  },[]);

  function setScreenBoth(s){
    screenRef.current=s;setScreen(s);
    if(s==='win'||s==='dead'||s==='start'||s==='fertil')stopAmbient();
    // Back to the home menu: drop the finished run (enemies, ovule, zone colours) so none of it shows behind the menu
    if(s==='start')gs.current=initState();
  }

  function getPos(e){
    const el=svgRef.current;if(!el)return null;
    const r=el.getBoundingClientRect(),s=e.touches?e.touches[0]:e;
    const {ox,oy,vbW,vbH}=vpRef.current;
    return{
      x:clamp(-ox+(s.clientX-r.left)*(vbW/r.width),POX+22,POX+PW-22),
      y:clamp(-oy+(s.clientY-r.top)*(vbH/r.height)-(e.touches?SET.offset:0),47+safeAreaRef.current.sat,GH-31),   // SET.offset lifts the sperm above the finger
    };
  }
  const onTS=e=>{_initAudio();touch.current=true;const p=getPos(e);if(p&&gs.current.phase==='playing'&&!pausedRef.current){gs.current.tx=p.x;gs.current.ty=p.y;}};
  const onTM=e=>{if(gs.current.phase==='playing')e.preventDefault();if(!touch.current)return;const p=getPos(e);if(p&&gs.current.phase==='playing'&&!pausedRef.current){gs.current.tx=p.x;gs.current.ty=p.y;}};
  const onTE=()=>touch.current=false;

  function startGame(infinite,hardcore){
    const s=initState();s.phase='playing';s.infinite=!!infinite;
    s.hardcore=!!hardcore;if(hardcore)s.lives=1;
    gs.current=s;setShareImg(null);setScreenBoth('playing');
    startAmbient();
  }

  // Share picture: 1080×1080 after a defeat, 1080×1920 "story" after a win. The game link goes in the share text, not in the picture.
  async function shareScore(){
    try{
      const g=gs.current,won=screenRef.current==='win'||g.phase==='win',inf=!!g.infinite,hard=!!g.hardcore;
      const W=1080,H=won?1920:1080;
      const cv=document.createElement('canvas');cv.width=W;cv.height=H;
      const ctx=cv.getContext('2d');

      const FN=(w,s)=>`${w} ${s}px Sora,Helvetica Neue,Arial,sans-serif`;

  // Small per-run mL reward: 1 per 10 rivals, +15 for a win, +2 per 30 s survived in infinite mode
  function runReward(g,won){
    return Math.floor(g.score/10)+(won?15:0)+(g.infinite?Math.floor(g.playT/30000)*2:0);
  }

  // End of run (death or win): save scores/stats, check achievements & challenges, grant mL
  function finishRun(g,won){
    g.phase=won?'fertil':'dead';if(won){g.fertT=0;g.fertV=0;}   // a win first plays the fertilization scene
    if(won)playSound('win');
    setScreenBoth(won?'fertil':'dead');
    try{
      if(won){localStorage.setItem('theone_won','1');setInfiniteUnlocked(true);}
      if(g.infinite){setHighScoresInf(saveHSInf(g.playT));}
      else{setHighScores(saveHS(g.score,won?4:g.zone,won));}
      setRec(saveRecRun(modeKeyOf(g),{won:!!won,zone:won?4:g.zone,rivals:g.score,time:g.playT,ts:Date.now()}));
      const newStats=recordGame({won,rivals:g.score,playT:g.playT,infinite:g.infinite,helmets:g.helmetsPicked,zone:g.zone,mode:modeKeyOf(g)});
      setStats(newStats);
      const bestInf=loadHSInf()[0]?.time||0;
      const ac=checkAchievements(newStats,bestInf,won?{perfectWin:g.lives===3,noHelmetWin:g.helmetsPicked===0}:{});
      setAchSet(ac.ach);
      if(ac.earned.length)setAchToast(ac.earned);
      const gSt=won
        ?{killsInGame:g.score,helmetsInGame:g.helmetsPicked,bestZoneInGame:5,playT:g.playT,won:true,infinite:false,
          perfectWin:g.hardcore?(g.lives===1):g.lives===3,noHelmetWin:!g.hardcore&&g.helmetsPicked===0,bestWinInGame:g.playT}
        :{killsInGame:g.score,helmetsInGame:g.helmetsPicked,bestInfInGame:g.infinite?g.playT:0,bestZoneInGame:g.zone+1,
          playT:g.playT,won:false,infinite:g.infinite};
      const dr=checkDaily(loadDaily(),gSt);setDaily(dr.d);
      const wr=checkWeekly(loadWeekly(),gSt);setWeekly(wr.w);
      const allEarned=[...dr.earned,...wr.earned];
      if(allEarned.length)setDailyToast(allEarned);
      g.runML=runReward(g,won);
      setML(saveML(loadML()+g.runML));
    }catch(e){console.log(e);}
  }

  function burst(g,x,y,color,n=10){
    n=Math.min(n,Math.max(0,(FX>=2?24:70)-g.ptcl.length));   // cap live particles (each one is DOM nodes)
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2,sp=1.5+Math.random()*3;
      g.ptcl.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:24+Math.random()*12,ml:36,color,id:uid()});
    }
  }

  // Individual enemy spawner — checks real-time lane occupancy to guarantee passage
  function spawnOne(g,zd,fz){
    const spd=lerp(zd.spd[0],zd.spd[1],fz);
    const type=zd.types[Math.floor(Math.random()*zd.types.length)];
    const minGaps=zd.minGaps||1;

    if(type==='sperm'){
      // Sperms come from bottom — check bottom occupancy
      const bOcc=new Set();
      g.sperms.filter(e=>e.y>GH-180).forEach(e=>bOcc.add(Math.floor(clamp((e.x-POX)/LW,0,LANES-1))));
      const bFree=Array.from({length:LANES},(_,i)=>i).filter(l=>!bOcc.has(l));
      if(bFree.length<1)return;
      const lane=bFree[Math.floor(Math.random()*bFree.length)];
      const lx=POX+(lane+0.5)*LW+(Math.random()-0.5)*LW*0.4;
      const spdVar=0.82+Math.random()*0.36;
      g.sperms.push({x:lx,y:GH+20+Math.random()*50,vx:(Math.random()-0.5)*0.7,svx:0,spd:spd*(zd.spermSpd||0.9)*spdVar,wob:Math.random()*100,id:uid()});
      return;
    }

    // Top-spawning enemies — check which lanes are free in spawn zone (y<240)
    const occ=new Set();
    [...g.mucus,...g.wbcs,...g.abs].filter(e=>e.y>-90&&e.y<240)
      .forEach(e=>occ.add(Math.floor(clamp((e.x-POX)/LW,0,LANES-1))));
    const free=Array.from({length:LANES},(_,i)=>i).filter(l=>!occ.has(l));
    // Must keep at least minGaps lanes free after placing
    const canFill=free.length-minGaps;
    if(canFill<1)return;
    // Shuffle free lanes, pick from first canFill
    const shuffled=[...free];
    for(let i=shuffled.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];}
    const lane=shuffled[Math.floor(Math.random()*canFill)];
    const lx=POX+(lane+0.5)*LW+(Math.random()-0.5)*LW*0.42;
    // Stagger y so enemies don't line up
    const yOff=-(15+Math.random()*55);
    if(type==='mucus')
      g.mucus.push({x:lx,y:yOff,spd:spd*0.5,r:20+Math.random()*10,pulse:Math.random()*100,id:uid()});
    else if(type==='wbc')
      g.wbcs.push({x:lx,y:yOff,spd:(spd*0.85+0.35)*(zd.wbcSpd||1),pulse:Math.random()*100,id:uid(),hom:0.00392});   // magnet strength -2% (was 0.004)
    else if(type==='antibody')
      g.abs.push({x:lx,y:yOff,spd:spd*1.1,angle:0,pulse:Math.random()*100,id:uid(),hom:0.013});
  }

  function endFert(){const g=gs.current;if(g.phase!=='fertil')return;g.phase='win';setScreenBoth('win');}
  function skipFert(){gs.current.fertT=FERT_DUR;}

  // Moves the composited decor layers (cheap: only CSS transforms, no repaint)
  function applyLayers(g){
    const L=LAYER_EL;if(!L.root)return;
    const {ox,vbW}=vpRef.current;
    const t=(g.bgT||0)+(g.drift||0);
    const wm=g.wallMix===undefined?1:g.wallMix;
    const off=sp=>(t*sp)%BP;
    const tr=(el,x,y)=>{if(el)el.style.transform=`translate3d(${x.toFixed(1)}px,${y.toFixed(1)}px,0)`;};
    tr(L.far,0,off(0.22)-BP);
    tr(L.near,0,off(0.55)-BP);
    tr(L.spk,0,off(1.25)-BP);
    const wy=off(1)-BP-20;
    tr(L.wallL,lerp(POX+ox,0,wm),wy);
    tr(L.wallR,lerp(POX+PW+ox,vbW,wm)-WALL_W,wy);
    if(L.sideL){const o=(1-wm).toFixed(2);L.sideL.style.opacity=o;L.sideR.style.opacity=o;}
  }
  // Adaptive quality: if the phone cannot hold ~40 fps for a few seconds, drop to a lighter look (remembered for next launches)
  // Rasterise the sprite bitmaps shortly after launch (vector fallbacks are drawn until each one is ready)
  React.useEffect(()=>{const t=setTimeout(bakeSprites,350);return()=>clearTimeout(t);},[]);
  const fpsRef=React.useRef({n:0,sum:0,skip:90});
  const frameRef=React.useRef(0);
  const modalRef=React.useRef(0);          // 0 none, 1 shop open (animated previews), 2 other static window open
  function watchFps(rawDt){
    const f=fpsRef.current;
    if(f.skip>0){f.skip--;return;}            // ignore warm-up frames
    if(rawDt>120)return;                       // ignore tab switches / hiccups
    f.sum+=rawDt;f.n++;
    if(f.n>=90){
      const avg=f.sum/f.n;f.n=0;f.sum=0;
      if(SET.quality==='auto'&&avg>25&&FX<2){
        FX++;f.skip=45;f.good=0;f.noUp=true;      // struggling: lighten, and do not climb back this session
        try{localStorage.setItem('theone_fx',String(FX));}catch(e){}
      }else if(SET.quality==='auto'&&avg<15.5&&FX>0&&!f.noUp){
        if(++f.good>=4){FX--;f.good=0;f.skip=45;try{localStorage.setItem('theone_fx',String(FX));}catch(e){}}   // ~6 s of smooth frames: raise quality again
      }else f.good=0;
    }
  }
  React.useEffect(()=>{
    let last=0;
    function tick(now){
      raf.current=requestAnimationFrame(tick); // ALWAYS re-queue first
      const rawDt=now-last;
      const dt=Math.min(rawDt,40);last=now;
      if(document.hidden)return;               // nothing to draw for a backgrounded page
      const g=gs.current;
      // Always animate wob/pulse for menu/shop animations
      g.wob+=dt*0.1;g.pulse+=dt*0.08;g.drift=(g.drift||0)+dt*0.03;
      // Canal width eases between window-wide (home menu) and play-lane width
      const wideT=screenRef.current==='start'?1:0;
      g.wallMix=g.wallMix===undefined?1:lerp(g.wallMix,wideT,clamp(dt/180,0,1));
      applyLayers(g);
      // Fertilization cinematic runs at full frame rate, then hands over to the victory screen
      if(g.phase==='fertil'){
        g.fertT+=dt/1000;
        if(g.fertV<1&&g.fertT>2.4){g.fertV=1;vibrate(40);}
        if(g.fertV<2&&g.fertT>4.55){g.fertV=2;vibrate([30,40,70]);}
        if(g.fertT>=FERT_DUR)endFert();
        re();return;
      }
      // Menus / paused screens only need ~30 fps
      if(g.phase!=='playing'||tutoRef.current!==null||landRef.current||pausedRef.current){
        // Menus run at ~30 fps; behind an open window: shop previews at ~15 fps, static windows not at all
        const m=modalRef.current;if(m===2)return;
        if((frameRef.current++%(m===1?4:2))===0)re();return;
      }
      watchFps(rawDt);
      if(g.inv>0)g.inv-=dt;
      if(g.hitFlash>0)g.hitFlash-=2;
      if(g.slowed>0)g.slowed-=dt;
      if(g.shield){g.shieldT-=dt;if(g.shieldT<=0)g.shield=false;}
      if(g.zoneAnn){g.zoneAnn.t-=dt;if(g.zoneAnn.t<=0)g.zoneAnn=null;}
      // Smooth bg blend between zones
      if(g.zoneBlend<1)g.zoneBlend=Math.min(1,g.zoneBlend+dt/1200);

      // Player
      const fs=g.slowed>0?0.07:0.17;
      const px0=g.px;
      g.px+=(g.tx-g.px)*fs*(dt/16);
      const py0=g.py;
      g.py+=(g.ty-g.py)*fs*(dt/16);
      const rawVx=g.px-px0;
      g.pvx=lerp(g.pvx||0,rawVx,clamp(0.12*(dt/16),0,1));
      // Trail particles: the equipped trail cosmetic, or the skin's own trail ("auto")
      const sk0=getSkin(equippedRef.current);
      const skTrail=SET.trail==='none'?null:(SET.trail==='auto'||!SET.trail?(sk0.trail||null):SET.trail);
      if(skTrail&&FX<2){
        const tfx=TRAIL_FX[skTrail]||{life:35,rate:1,vy:0.3};
        const speed=Math.abs(rawVx)+Math.abs(g.py-py0);
        const rate=(0.5+Math.min(speed*0.1,1.5))*tfx.rate;
        if(Math.random()<rate*(dt/100)){
          g.trail.push({x:g.px+(Math.random()-0.5)*10,y:g.py+(Math.random()-0.5)*10+8,life:tfx.life,ml:tfx.life,type:skTrail,big:(SET.trail!=='auto'&&SET.trail!=='none'&&skTrail!=='comet'),seed:Math.random()*100,vy:(tfx.vy!==undefined?tfx.vy:0.3)+(tfx.vy===undefined?Math.random()*0.4:Math.random()*0.15),vx:(tfx.vx||0)*(Math.random()-0.5)*2});
        }
      }
      g.trail=g.trail.filter(p=>p.life>0).map(p=>{p.life-=dt/16;p.y+=p.vy*(dt/16);if(p.vx)p.x+=p.vx*(dt/16);return p;});

      // Scroll
      const zd=effZD(g);
      const fz=clamp(g.tiz/(zd.dur===999?60:zd.dur),0,1);
      g.bg=(g.bg+lerp(zd.scr[0],zd.scr[1],fz)*(dt/16))%GH;
      g.bgT=(g.bgT||0)+lerp(zd.scr[0],zd.scr[1],fz)*(dt/16);
      g.tiz+=dt/1000;
      g.playT+=dt;

      // Wave/rest — shorter rests
      g.waveT+=dt;
      if(g.waveOn&&g.waveT>=g.waveDur){
        g.waveT=0;
        if(g.zone===0){g.waveDur=4000+Math.random()*3500;} // zone 1 : pas de pause
        else{g.waveOn=false;g.restDur=g.zone>=3?(300+Math.random()*500):(800+Math.random()*1200);}
      }
      else if(!g.waveOn&&g.waveT>=g.restDur){g.waveOn=true;g.waveT=0;g.waveDur=g.zone>=3?(5500+Math.random()*3000):(4000+Math.random()*3500);}

      // Individual enemy spawn
      if(g.waveOn){
        g.spawnT+=dt;
        const ms=lerp(zd.ms[0],zd.ms[1],fz);
        while(g.spawnT>=ms){g.spawnT-=ms;spawnOne(g,zd,fz);}
      }
      g.lastHelmT+=dt;
      if(!g.hardcore&&!g.shield&&g.helmets.length<1&&g.lastHelmT>11000&&g.zone>=1&&Math.random()<0.00007*dt){
        g.helmets.push({x:POX+30+Math.random()*(PW-60),y:-45,pulse:0,id:uid(),hspd:1.172});
        g.lastHelmT=0;
      }

      // Move top→bottom enemies
      g.mucus=g.mucus.filter(m=>m.y<GH+70).map(m=>{m.y+=m.spd*(dt/16);m.x=clamp(m.x,POX+28,POX+PW-28);m.pulse+=dt*0.07;return m;});
      g.wbcs=g.wbcs.filter(w=>w.y<GH+70).map(w=>{
        w.y+=w.spd*(dt/16);w.x=clamp(w.x+(g.px-w.x)*w.hom*(dt/16),POX+28,POX+PW-28);w.pulse+=dt*0.08;return w;
      });
      g.abs=g.abs.filter(a=>a.y<GH+70).map(a=>{
        a.y+=a.spd*(dt/16);
        const dx=g.px-a.x,dy=g.py-a.y,dd=Math.sqrt(dx*dx+dy*dy)||1;
        a.x=clamp(a.x+dx/dd*a.hom*(dt/16)*a.spd*2.5,POX+28,POX+PW-28);
        a.angle=Math.atan2(dy,dx)*(180/Math.PI)+90;
        a.pulse+=dt*0.1;return a;
      });

      // Enemy sperms bottom→top; escaped = lose life
      const nextSperms=[];
      for(const e of g.sperms){
        e.y-=e.spd*(dt/16);e.x+=e.vx*(dt/16);
        if(e.x<POX+28||e.x>POX+PW-28)e.vx*=-1;
        e.x=clamp(e.x,POX+28,POX+PW-28);
        e.svx=lerp(e.svx!==undefined?e.svx:e.vx,e.vx,clamp(0.12*(dt/16),0,1));
        e.wob+=dt*0.08;
        if(e.y<-65){
          // escaped — penalise
          g.hitFlash=25;g.lives--;g.inv=900;
          if(g.lives<=0)playSound('dead');else playSound('hit');vibrate(60);
          burst(g,clamp(e.x,POX+20,POX+PW-20),15,P.rose,8);
          if(g.lives<=0){finishRun(g,false);return;}
        } else if(d2(g.px,g.py,e.x,e.y)<PR+15){
          if(FX<2)burst(g,e.x,e.y,'#e89870',10);g.score++;vibrate(15);playSound('kill');
        } else {
          nextSperms.push(e);
        }
      }
      g.sperms=nextSperms;

      // Helmets
      g.helmets=g.helmets.filter(h=>h.y<GH+60).map(h=>{h.y+=(h.hspd||1.035)*(dt/16);h.pulse+=dt*0.08;return h;});
      g.ptcl=g.ptcl.filter(p=>p.life>0).map(p=>{p.x+=p.vx*(dt/16);p.y+=p.vy*(dt/16);p.vy+=0.08;p.life-=dt/16;return p;});

      // Mucus slow
      for(let i=g.mucus.length-1;i>=0;i--){
        if(d2(g.px,g.py,g.mucus[i].x,g.mucus[i].y)<PR+g.mucus[i].r-5){
          if(g.slowed<=0)burst(g,g.mucus[i].x,g.mucus[i].y,'#aae030',7);
          playSound('slow');
          g.slowed=1400;g.mucus.splice(i,1);break;
        }
      }

      // WBC/Antibody hit
      if(g.inv<=0){
        const hl=[...g.wbcs.map(w=>({...w,_t:'wbc'})),...g.abs.map(a=>({...a,_t:'ab'}))];
        for(const e of hl){
          if(d2(g.px,g.py,e.x,e.y)<PR+(e._t==='wbc'?27:21)){
            if(g.shield){
              g.shield=false;burst(g,e.x,e.y,'#f5c842',14);g.inv=500;
              if(e._t==='wbc')g.wbcs=g.wbcs.filter(w=>w.id!==e.id);
              else g.abs=g.abs.filter(a=>a.id!==e.id);
            }else{
              g.hitFlash=30;g.lives--;g.inv=1800;
              if(g.lives<=0)playSound('dead');else playSound('hit');vibrate(60);
              burst(g,e.x,e.y,e._t==='wbc'?'#88ccff':'#6090e0',12);
              if(e._t==='wbc')g.wbcs=g.wbcs.filter(w=>w.id!==e.id);
              else g.abs=g.abs.filter(a=>a.id!==e.id);
              if(g.lives<=0){finishRun(g,false);return;}
            }
            break;
          }
        }
      }

      // Helmet pickup
      for(let i=g.helmets.length-1;i>=0;i--){
        if(d2(g.px,g.py,g.helmets[i].x,g.helmets[i].y)<PR+22){
          g.shield=true;g.shieldT=8000;burst(g,g.helmets[i].x,g.helmets[i].y,'#f5c842',16);g.helmetsPicked++;g.helmets.splice(i,1);
        }
      }

      // Zone advance — seamless, no pause
      if(g.zone<ZONES.length-1&&g.tiz>=ZONES[g.zone].dur){
        g.prevZone=g.zone;g.zone++;g.tiz=0;g.zoneBlend=0;
        g.waveOn=true;g.waveT=0;g.spawnT=0;
        // Don't clear existing enemies — let them naturally exit for continuity
        const nz=ZONES[g.zone];
        g.zoneAnn={name:g.infinite&&g.zone===4?'Mode Infini':nz.name,dname:g.infinite&&g.zone===4?'Mode Infini':nz.dname,emoji:g.infinite&&g.zone===4?'∞':nz.emoji,demoji:g.infinite&&g.zone===4?'∞':nz.demoji,t:2000};
      }

      // Zone 5 ovule — rotating with single entry (skipped in infinite mode)
      if(g.zone===4&&!g.infinite){
        if(g.tiz>5)g.ovuleY=clamp(-160+(g.tiz-5)*22,-160,100);
        g.ovuleAngle=(g.ovuleAngle+0.0018*dt)%(Math.PI*2);
        // Solid as soon as it reaches the playable area (not only once parked), so the entry can be hit while it descends
        if(g.ovuleY>-37){
          const dd=d2(g.px,g.py,GW/2,g.ovuleY);
          const gapH=g.hardcore?OV_GAP_HC:OV_GAP;
          const pA=Math.atan2(g.py-g.ovuleY,g.px-GW/2);
          let diff=Math.abs(pA-g.ovuleAngle)%(Math.PI*2);
          if(diff>Math.PI)diff=Math.PI*2-diff;
          const inEntry=diff<gapH;
          // The membrane is always solid (even while invulnerable): only the rotating gap lets you in.
          // A contact costs a life (or the helmet), then the usual invulnerability avoids losing several in a row.
          if(dd<PR+62&&!inEntry){
            const nx=(g.px-GW/2)/(dd||1),ny=(g.py-g.ovuleY)/(dd||1);
            g.px=GW/2+nx*(PR+62);g.py=g.ovuleY+ny*(PR+62);
            g.tx=g.px+nx*28;g.ty=g.py+ny*28;
            if(g.inv<=0){
              if(g.shield){g.shield=false;burst(g,GW/2,g.ovuleY,'#f5c842',14);g.inv=500;}
              else{
                g.hitFlash=30;g.lives--;g.inv=1800;
                if(g.lives<=0)playSound('dead');else playSound('hit');vibrate(60);
                if(g.lives<=0){finishRun(g,false);return;}
              }
            }
          }
          {const bx=GW/2+Math.cos(g.ovuleAngle)*58,by=g.ovuleY+Math.sin(g.ovuleAngle)*58;
          if(d2(g.px,g.py,bx,by)<PR+20){
            burst(g,GW/2,g.ovuleY,'#ffd700',40);
            finishRun(g,true);return;
          }}
        }
      }

      re();
    }
    raf.current=requestAnimationFrame(tick);
    return()=>cancelAnimationFrame(raf.current);
  },[]);

  const g=gs.current;
  const z=effZD(g);
  const pz=ZONES[g.prevZone||0]||ZONES[0];
  const fz=clamp(g.tiz/(z.dur===999?60:z.dur),0,1);
  const totalProg=g.infinite&&g.zone===4?1:clamp((g.zone+(z.dur===999?0.99:fz))/ZONES.length,0,1);
  const bgl=lerpHex(pz.bg1,z.bg1,g.zoneBlend||1);
  const bgd=lerpHex(pz.bg2,z.bg2,g.zoneBlend||1);
  const fxLevel=FX;
  modalRef.current=(showShop||showStats||showAch||showDaily||showInfo||showSettings||showQuick||showEarn||showHow||showMode||showStreak)?2:0;   // every window animates itself or is static: no need to redraw the whole game behind

  // CSS filter for hit flash
  const hitCss='none'; // hit feedback is now an in-SVG red vignette (cheaper than a CSS filter)

  const _vpS=Math.min(window.innerWidth/GW,window.innerHeight/GH);
  const _vpW=window.innerWidth/_vpS,_vpH=window.innerHeight/_vpS;
  vpRef.current={ox:(_vpW-GW)/2,oy:(_vpH-GH)/2,vbW:_vpW,vbH:_vpH};
  const {ox,oy,vbW,vbH}=vpRef.current;

  // Height-adaptive menu layout: buttons anchored to the bottom, score lists keep only the rows that fit
  const LY=(()=>{
    const btm=GH-SAB;
    const s2Y=btm-14-32, playY=s2Y-12-56;
    const infHdrY=highScoresInf.length>0?playY-60:null;
    const hsY=GH*0.56;
    const hsRows=clamp(Math.floor(((infHdrY===null?playY:infHdrY)-14-(hsY+5))/44),0,3);
    const heroY=SAT+clamp(GH*0.2,80,170);
    const titleY=heroY+clamp(GH*0.19,95,150);
    const cardY=titleY+46, dScoresY=cardY+92;
    const menuY=btm-20, infY=menuY-48;
    const retryY=(infiniteUnlocked?infY-14:menuY-26)-52;
    const dRows=clamp(Math.floor((retryY-12-(dScoresY+5))/38),0,3);
    return{s2Y,playY,infHdrY,hsY,hsRows,heroY,titleY,cardY,dScoresY,menuY,infY,retryY,dRows};
  })();

  const eco=FX>=2;
  // closest challenge (home card) and the quickest objectives (earn-mL popup)
  const chals=React.useMemo(()=>{
    const out=[];
    [[daily,CH_TEMPLATES,'ds',false],[weekly,WK_TEMPLATES,'ws',true]].forEach(([d,T,k,wk])=>{
      const part=[];
      d.ch.forEach(c=>{
        if(c.completed)return;
        const tpl=T.find(t=>t.id===c.tplId),pr=progressOf(tpl,d[k],c),p=pr?pr.p:0;
        part.push({p,label:c.fmt,txt:pr?(pr.txt.length<=9?pr.txt:Math.round(p*100)+'%'):tr('1 partie'),ml:c.ml,col:TIERS[chTier(c)].color,week:wk});
      });
      part.sort((a,b)=>b.p-a.p);out.push(...part);
    });
    return out;
  },[daily,weekly]);
  const pendingCh=React.useMemo(()=>daily.ch.filter(c=>!c.completed).length+weekly.ch.filter(c=>!c.completed).length,[daily,weekly]);
  const earnItems=React.useMemo(()=>{
    const out=[];
    [[daily,CH_TEMPLATES,'ds'],[weekly,WK_TEMPLATES,'ws']].forEach(([d,T,k])=>d.ch.forEach(c=>{
      if(c.completed)return;
      const tpl=T.find(t=>t.id===c.tplId),pr=progressOf(tpl,d[k],c);
      out.push({ic:'target',c:(TIERS[c.t]||TIERS.medium).color,title:c.fmt,sub:pr?pr.txt:'À réussir en une seule partie',p:pr?pr.p:0,ml:c.ml});
    }));
    const sExt={...stats,bestInfTime:rec.i[0]?rec.i[0].time:0};
    ACHIEVEMENTS.forEach(a=>{if(achSet.has(a.id))return;const pr=achProg(a,sExt);out.push({ic:'trophy',c:TIERS[a.tier].color,title:trf('Succès « {n} »',{n:tr(a.name)}),sub:pr.txt,p:pr.p,ml:a.ml});});
    out.sort((x,y)=>y.p-x.p);
    const top=out.slice(0,2);
    top.push({ic:'flame',c:'#ffc43f',title:'Série : reviens demain',sub:trf('Jour {n} de ta série',{n:LOGIN0.streak}),p:null,ml:LOGIN_REWARDS[Math.min(LOGIN0.streak,6)]});
    return top;
  },[daily,weekly,achSet,stats,rec]);
  // stable handler bag for the memoised screens (always points at the latest closures)
  const apiRef=React.useRef({});const api=apiRef.current;
  Object.assign(api,{
    play:()=>{_initAudio();startGame(mode==='i',mode==='h');},
    retry:()=>{const gg=gs.current;startGame(gg.infinite,gg.hardcore);},
    home:()=>setScreenBoth('start'),
    infinite:()=>{setModeS('i');localStorage.setItem(MODE_KEY,'i');startGame(true,false);},
    share:()=>shareScore(),
    openStreak:()=>{setShowEarn(false);setShowQuick(false);setShowMode(false);setShowStreak(true);},
    openMode:()=>{setShowEarn(false);setShowQuick(false);setShowMode(true);},
    skinStep:d=>{
      const list=SKINS.filter(s=>owned.has(s.id));if(list.length<2)return;
      const i=Math.max(0,list.findIndex(s=>s.id===equipped));
      equipItem(list[(i+d+list.length)%list.length].id);
    },
    toggleDiscrete:()=>{const d=!discreteMode;setDiscreteMode(d);try{localStorage.setItem('theone_discrete',d?'1':'0');}catch(e){}},
    setMute:v=>{_muted=v;try{localStorage.setItem('theone_muted',v?'1':'0');}catch(e){}if(window.Howler)Howler.mute(v);setMuted(v);},
    openQuick:()=>{setShowEarn(false);setShowQuick(true);},
    openEarn:()=>{setShowQuick(false);setShowEarn(true);},
    openShop:()=>{setShowEarn(false);setShowQuick(false);setShowShop(true);},
    openAch:()=>setShowAch(true),
    openChallenges:()=>{setShowEarn(false);setShowDaily(true);},
    openStats:()=>setShowStats(true),
  });

  return(
    <div ref={divRef} className={"gw"+(eco?" eco":"")} style={{filter:hitCss}}
      onMouseDown={onTS} onMouseMove={onTM} onMouseUp={onTE}
      onTouchStart={onTS} onTouchEnd={onTE}
    >
      {/* Background colour + composited decor layers (moved by applyLayers, never repainted) */}
      <div style={{position:'absolute',left:0,top:0,right:0,bottom:0,background:`linear-gradient(to bottom,${bgl},${bgd})`}}/>
      <Layers acc={z.acc} vbW={vbW} vbH={vbH} ox={ox} S={_vpS} fx={fxLevel}/>
      <svg ref={svgRef} viewBox={`${-ox} ${-oy} ${vbW} ${vbH}`} preserveAspectRatio="none" style={{touchAction:screen==='playing'?'none':'auto',position:'relative'}}>
        <defs>
          <FxDefsM acc={z.acc}/>
        </defs>

        {/* Ovule */}
        {g.zone===4&&g.ovuleY>-130&&<Ovule x={GW/2} y={g.ovuleY} pulse={g.pulse} angle={g.ovuleAngle} hard={g.hardcore}/>}

        <Ptcl list={g.ptcl}/>

        {g.mucus.map(m=><Mucus key={m.id} x={m.x} y={m.y} pulse={m.pulse} r={m.r} v={vOf(m.id,N_MUCUS)}/>)}
        {g.wbcs.map(w=><WBC key={w.id} x={w.x} y={w.y} pulse={w.pulse} v={vOf(w.id,N_WBC)}/>)}
        {g.abs.map(a=><Antibody key={a.id} x={a.x} y={a.y} angle={a.angle} pulse={a.pulse}/>)}
        {g.sperms.map(e=><SpermEnemy key={e.id} x={e.x} y={e.y} wob={e.wob} vx={e.vx} svx={e.svx} v={vOf(e.id,N_RIVAL)}/>)}
        {g.helmets.map(h=><Helmet key={h.id} x={h.x} y={h.y} pulse={h.pulse}/>)}

        {/* Player & skin trail */}
        {screen==='playing'&&(<React.Fragment>
          {g.trail.map(p=>p.big
            ?<g key={p.seed} transform={`translate(${p.x} ${p.y}) scale(1.45) translate(${-p.x} ${-p.y})`}><TrailDot p={p} a={Math.max(0,p.life/p.ml)}/></g>
            :<TrailDot key={p.seed} p={p} a={Math.max(0,p.life/p.ml)}/>)}
          <g opacity={g.inv>0?(Math.sin(g.inv*0.025)>0?1:0.35):1}>
            <SpermPlayer x={g.px} y={g.py} wob={g.wob} hit={false} shield={g.shield} tilt={g.pvx} skin={getSkin(equipped)}/>
            {g.shield&&(()=>{const C=2*Math.PI*33;return<g transform={`translate(${g.px},${g.py})`}>
              <circle r="33" fill="none" stroke="rgba(255,210,94,.18)" strokeWidth="3"/>
              <circle r="33" fill="none" stroke="#ffd25e" strokeWidth="3" strokeLinecap="round" strokeDasharray={`${C*Math.max(0,g.shieldT/8000)} ${C}`} transform="rotate(-90)"/>
            </g>;})()}
          </g>
        </React.Fragment>)}

        {/* Escape warning: rivals close to the top edge cost a life if they get out */}
        {screen==='playing'&&g.sperms.map(e=>{
          const a=clamp((170-e.y)/140,0,1);if(a<=0)return null;
          const p=0.55+Math.sin(g.pulse*0.18)*0.45;
          const ty=SAT+58;
          return(<g key={'w'+e.id} opacity={a}>
            <circle cx={e.x} cy={e.y} r="23" fill="none" stroke="#ff3b5c" strokeWidth="1.8" opacity={p}/>
            <circle cx={e.x} cy={ty+5} r="14" fill="#ff3b5c" opacity={p*0.16}/>
            <path d={`M ${e.x-8} ${ty+9} L ${e.x} ${ty+1} L ${e.x+8} ${ty+9}`} stroke="#ff3b5c" strokeWidth="3" fill="none" strokeLinecap="round" strokeLinejoin="round" opacity={p}/>
          </g>);
        })}

        {/* ── HUD (the rest of the HUD is HTML, see below) ── */}
        {screen==='playing'&&(<>
          <rect x={-ox} y={-oy} width={vbW} height={oy+64+SAT} fill="url(#hudGrad)"/>
          {g.slowed>0&&(()=>{
            const C=2*Math.PI*20,pct=Math.max(0,Math.min(1,g.slowed/1400));
            return(<g transform={`translate(${GW/2},${GH-60-SAB})`}>
              <circle cx="0" cy="0" r="30" fill="url(#glowLime)" opacity="0.5"/>
              <circle cx="0" cy="0" r="23" fill="rgba(10,3,12,0.72)"/>
              <circle cx="0" cy="0" r="23" fill="url(#glass)"/>
              <circle cx="0" cy="0" r="20" fill="none" stroke="rgba(196,242,74,0.16)" strokeWidth="3"/>
              <circle cx="0" cy="0" r="20" fill="none" stroke="#c4f24a" strokeWidth="3" strokeLinecap="round" strokeDasharray={`${C*pct} ${C}`} transform="rotate(-90)"/>
              <path d={smoothClosed(blobPts(0,1,8,i=>9+Math.sin(g.pulse*0.06+i*1.7)*1.4))} fill="url(#mucusBody)" stroke="#d8fa7a" strokeOpacity="0.8" strokeWidth="1"/>
              <ellipse cx="-3" cy="-2.5" rx="3.6" ry="1.6" fill="#fff" opacity="0.6" transform="rotate(-25,-3,-2.5)"/>
            </g>);
          })()}
        </>)}

        {/* Zone banner (seamless — game continues underneath) */}
        {g.zoneAnn&&screen==='playing'&&(()=>{
          const a=clamp(Math.min(g.zoneAnn.t/350,(g.zoneAnn.t>300?1:g.zoneAnn.t/300)),0,1);
          const slide=(1-clamp((2000-g.zoneAnn.t)/350,0,1))*24;
          const name=discreteMode?g.zoneAnn.dname:g.zoneAnn.name;
          const idx=g.infinite&&g.zone===4?'∞':`ZONE ${g.zone+1} / ${ZONES.length}`;
          return(
            <g opacity={a} transform={`translate(0,${slide})`}>
              <rect x={-ox} y={GH*0.40} width={vbW} height="104" fill="url(#bannerGrad)"/>
              <line x1={GW/2-110} y1={GH*0.40+30} x2={GW/2-44} y2={GH*0.40+30} stroke={z.acc} strokeOpacity="0.7" strokeWidth="1"/>
              <line x1={GW/2+44} y1={GH*0.40+30} x2={GW/2+110} y2={GH*0.40+30} stroke={z.acc} strokeOpacity="0.7" strokeWidth="1"/>
              <text x={GW/2} y={GH*0.40+34} textAnchor="middle" fill={z.acc} fontSize="10.5" fontWeight="700" letterSpacing="3" fontFamily="Sora,Helvetica Neue,Arial">{idx}</text>
              <text x={GW/2} y={GH*0.40+70} textAnchor="middle" fill="#fff" fontSize="27" fontWeight="800" letterSpacing="-0.5" fontFamily="Sora,Helvetica Neue,Arial">{name}</text>
            </g>
          );
        })()}

        {/* Dim behind the home / end-of-run screens (their content is HTML, see the UI overlays after the SVG) */}
        {(screen==='start'||screen==='dead'||screen==='win')&&<rect x={-ox} y={-oy} width={vbW} height={vbH} fill={screen==='win'?'rgba(14,9,2,0.86)':screen==='dead'?'rgba(16,2,8,0.86)':'rgba(10,2,8,0.5)'}/>}
        {screen==='win'&&SET.vic!=='classic'&&<g transform={`translate(${-ox},${-oy})`}><VictoryFx type={SET.vic} t={g.pulse/80} W={vbW} H={vbH}/></g>}
        {/* Daily challenges modal — HTML overlay (outside SVG, see below) */}

        {/* Fertilization cinematic */}
        {screen==='fertil'&&<FertScene t={g.fertT||0} W={vbW} H={vbH} ox={ox} oy={oy} skin={getSkin(equipped)} onSkip={skipFert}/>}

        {/* Achievements modal — HTML overlay (outside SVG, see below) */}

        {/* Shop modal rendered outside SVG (see below) */}

        {/* Stats modal — HTML overlay (outside SVG, see below) */}

        {/* Info modal — HTML overlay (outside SVG, see below) */}

      </svg>
      {/* ── 2026 UI: home and end of run (HTML over the canvas) ── */}
      {!landscape&&!dailyToast&&!achToast&&screen==='start'&&<HomeScreen SAT={SAT} SAB={SAB} mode={mode} rec={rec} mL={mL} streak={LOGIN0.streak} skin={getSkin(equipped)} discrete={discreteMode} chals={chals} pending={pendingCh} api={api} eco={eco}/>}
      {!landscape&&!dailyToast&&!achToast&&(screen==='dead'||screen==='win')&&<EndScreen won={screen==='win'} inf={!!g.infinite} hard={!!g.hardcore} zone={g.zone} score={g.score} time={g.playT} runML={g.runML||0} mode={modeKeyOf(g)} e={rec[modeKeyOf(g)][0]} discrete={discreteMode} infUnlocked={infiniteUnlocked} skin={getSkin(equipped)} SAT={SAT} SAB={SAB} api={api} eco={eco}/>}
      {shareImg&&<div onClick={()=>setShareImg(null)} style={{position:'absolute',inset:0,zIndex:40,background:'rgba(0,0,0,.88)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:14,padding:20,fontFamily:U_FONT,color:'#fff'}}><img src={shareImg} alt="" style={{maxWidth:'100%',maxHeight:'80%',borderRadius:16,boxShadow:'0 12px 40px rgba(0,0,0,.6)'}}/><div style={{fontSize:12,color:'var(--text-2)',textAlign:'center'}}>{tr('Appui long sur l\'image pour sauvegarder — tap pour fermer')}</div></div>}
      {screen!=='fertil'&&(dailyToast||achToast)&&<RewardsOverlay aList={achToast||[]} dList={dailyToast||[]} SAT={SAT} SAB={SAB} onDone={()=>{setDailyToast(null);setAchToast(null);}}/>}
      {showMode&&<ModePopup SAB={SAB} mode={mode} infUnlocked={infiniteUnlocked} onClose={()=>setShowMode(false)} onPick={k=>{setModeS(k);try{localStorage.setItem(MODE_KEY,k);}catch(e){}setShowMode(false);}}/>}
      {showStreak&&<StreakPopup SAT={SAT} onClose={()=>setShowStreak(false)} streak={LOGIN0.streak}/>}
      {showQuick&&<QuickSettings SAT={SAT} onClose={()=>setShowQuick(false)} onHow={()=>{setShowQuick(false);setShowHow(true);}} onAll={()=>{setShowQuick(false);setShowSettings(true);}} onChange={()=>re()} muted={muted} onMute={api.setMute}/>}
      {showEarn&&<EarnPopup SAT={SAT} onClose={()=>setShowEarn(false)} mL={mL} items={earnItems} onChallenges={api.openChallenges} onShop={api.openShop}/>}
      {loginToast&&screen==='start'&&!dailyToast&&!achToast&&<RewardToast SAT={SAT} ml={loginToast.reward} text={loginToast.streak>1?trf('Série de {n} jours',{n:loginToast.streak}):tr('Connexion quotidienne')} onDone={()=>setLoginToast(null)}/>}
      {/* Hit flash / mucus slow tint: CSS overlays (compositor-only opacity) instead of full-screen SVG rects */}
      <div style={{position:'absolute',left:0,top:0,right:0,bottom:0,pointerEvents:'none',willChange:'opacity',opacity:screen==='playing'?clamp(g.hitFlash/30,0,1):0,background:'radial-gradient(ellipse 75% 75% at 50% 50%,rgba(255,30,70,0) 45%,rgba(255,30,70,0.6) 100%)'}}/>
      <div style={{position:'absolute',left:0,top:0,right:0,bottom:0,pointerEvents:'none',willChange:'opacity',opacity:screen==='playing'&&g.slowed>0?clamp(g.slowed/700,0,1):0,background:'radial-gradient(ellipse 75% 75% at 50% 50%,rgba(182,232,58,0) 50%,rgba(182,232,58,0.3) 100%)'}}/>
      {/* HUD: zone progress (top), lives, rival counter, pause */}
      {screen==='playing'&&(
        <div style={{position:'absolute',left:0,right:0,top:0,zIndex:4,pointerEvents:'none',fontFamily:"Sora,'Helvetica Neue',Arial,sans-serif",color:'#fff'}}>
          <div style={{position:'fixed',left:0,right:0,bottom:0,height:5,background:'rgba(255,255,255,.10)'}}>
            <div style={{position:'absolute',left:0,top:0,bottom:0,width:`${totalProg*100}%`,background:`linear-gradient(90deg,${ZONES[0].acc},${z.acc})`,boxShadow:FX<2?`0 0 10px ${z.acc}`:'none',borderRadius:'0 2px 2px 0'}}/>
            {[1,2,3,4].map(k=><div key={k} style={{position:'absolute',left:`${k*20}%`,top:0,bottom:0,width:2,background:'rgba(6,1,10,.8)'}}/>)}
          </div>
          <div style={{display:'flex',alignItems:'center',padding:`${10+SAT}px 14px 0`}}>
            <div style={{flex:1,display:'flex',alignItems:'center',gap:4}}>
              {g.hardcore?<LifeSperm on={g.lives>0}/>:[0,1,2].map(i=><LifeSperm key={i} on={i<g.lives}/>)}
            </div>
            <div style={{display:'flex',alignItems:'center',gap:6,fontSize:22,fontWeight:800,letterSpacing:-.5,fontVariantNumeric:'tabular-nums'}}>
              {g.infinite?<><Ic n="clock" s={18} sw={2.2} style={{color:'#7cc4ff'}}/>{fmtTime(g.playT)}</>:<><MiniRival s={22}/>{g.score}</>}
            </div>
            <div style={{flex:1,display:'flex',justifyContent:'flex-end'}}>
              {tuto===null&&!paused&&!landscape&&g.phase==='playing'&&
                <button className="ui-btn" aria-label={tr('Pause')} onClick={e=>{e.stopPropagation();pauseGame();}} onTouchStart={e=>e.stopPropagation()} onMouseDown={e=>e.stopPropagation()}
                  style={{pointerEvents:'auto',width:44,height:44,borderRadius:22,background:'rgba(18,4,16,.35)',border:'1px solid rgba(255,255,255,.2)',display:'flex',alignItems:'center',justifyContent:'center',padding:0,backdropFilter:eco?'none':'blur(6px)',WebkitBackdropFilter:eco?'none':'blur(6px)'}}>
                  <svg viewBox="-8 -8 16 16" style={{width:15,height:15,display:'block'}}><rect x="-5" y="-5.5" width="3.4" height="11" rx="1.2" fill="#fff"/><rect x="1.6" y="-5.5" width="3.4" height="11" rx="1.2" fill="#fff"/></svg>
                </button>}
            </div>
          </div>
        </div>
      )}
      {paused&&screen==='playing'&&(
        <div onClick={e=>e.stopPropagation()} onTouchStart={e=>e.stopPropagation()} onMouseDown={e=>e.stopPropagation()}
          style={{position:'absolute',inset:0,zIndex:12,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:12,background:'rgba(8,2,12,0.66)',backdropFilter:'blur(10px)',WebkitBackdropFilter:'blur(10px)',color:'#fff',fontFamily:'Sora,Helvetica Neue,Arial'}}>
          {countdown>0?(
            <div key={countdown} style={{fontSize:110,fontWeight:800,letterSpacing:-4,background:'linear-gradient(180deg,#fff9f4,#ffcdb5 55%,#ff8fa8)',WebkitBackgroundClip:'text',backgroundClip:'text',WebkitTextFillColor:'transparent',animation:'cdpop .45s ease-out'}}>{countdown}</div>
          ):(<>
            <div style={{fontSize:34,fontWeight:800,letterSpacing:-1,marginBottom:10,background:'linear-gradient(180deg,#fff9f4,#ffcdb5 55%,#ff8fa8)',WebkitBackgroundClip:'text',backgroundClip:'text',WebkitTextFillColor:'transparent'}}>{tr('Pause')}</div>
            <MenuBtn kind="primary" onClick={resumeGame}>{tr('Reprendre')}</MenuBtn>
            <MenuBtn onClick={()=>leaveRun(true)}>{tr('Recommencer')}</MenuBtn>
            <MenuBtn onClick={()=>leaveRun(false)}>{tr('Quitter la partie')}</MenuBtn>
          </>)}
        </div>
      )}
      {/* Rotate-your-phone screen (landscape is blocked on touch devices) */}
      {landscape&&(
        <div style={{position:'absolute',inset:0,zIndex:50,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:18,background:'radial-gradient(120% 90% at 50% 30%,#4a0a28,#0a0108 70%)',color:'#fff',textAlign:'center',padding:24}}>
          <svg viewBox="-40 -40 80 80" width="96" height="96">
            <g transform={`rotate(${-90*(0.5+0.5*Math.sin(g.wob*0.03))})`}>
              <rect x="-15" y="-26" width="30" height="52" rx="6" fill="none" stroke="#fff" strokeWidth="2.5"/>
              <rect x="-5" y="-22" width="10" height="2" rx="1" fill="#fff" opacity="0.6"/>
            </g>
            <path d="M 26 -18 A 32 32 0 0 1 30 10" fill="none" stroke="#ff8fa8" strokeWidth="2.5" strokeLinecap="round"/>
            <path d="M 25 6 L 30 11 L 35 5" fill="none" stroke="#ff8fa8" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
          <div style={{fontSize:20,fontWeight:800}}>Tourne ton téléphone</div>
          <div style={{fontSize:13,color:'rgba(255,225,215,0.7)',maxWidth:260,lineHeight:'19px'}}>TheOne se joue uniquement en mode portrait.{screen==='playing'?' La partie est en pause.':''}</div>
        </div>
      )}
      {showShop&&<ShopModal onClose={()=>setShowShop(false)} SAT={SAT} SAB={SAB} mL={mL} owned={owned} equipped={equipped} onEquip={equipItem} onBuy={buyItem}/>}
      {showDaily&&<ChallengesModal onClose={()=>setShowDaily(false)} SAT={SAT} SAB={SAB} daily={daily} weekly={weekly}/>}
      {showStats&&<StatsModal onClose={()=>setShowStats(false)} SAT={SAT} SAB={SAB} stats={stats} rec={rec} discrete={discreteMode}/>}
      {showSettings&&<SettingsModal onClose={()=>setShowSettings(false)} SAT={SAT} SAB={SAB} onChange={()=>re()} muted={muted} onMute={api.setMute} stats={stats} owned={owned}/>}
      {showHow&&<HowToPlay onClose={()=>setShowHow(false)} SAT={SAT} SAB={SAB} skin={getSkin(equipped)}/>}
      {showAch&&<RewardsModal onClose={()=>setShowAch(false)} SAT={SAT} SAB={SAB} achSet={achSet} stats={stats} bestInf={rec.i[0]?rec.i[0].time:0}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Game/>);
</script>
</body>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
</script>
</html>
