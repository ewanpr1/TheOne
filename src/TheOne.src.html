/* ── High scores ─────────────────────────────────────────── */
const HS_KEY='theone_hs';
const HS_INF_KEY='theone_hs_inf';
function loadHS(){try{return JSON.parse(localStorage.getItem(HS_KEY)||'[]');}catch{return[];}}
function loadHSInf(){try{return JSON.parse(localStorage.getItem(HS_INF_KEY)||'[]');}catch{return[];}}
function saveHS(score,zone,won){
  const hs=loadHS();
  hs.push({score,zone,won:!!won,d:new Date().toLocaleDateString('fr')});
  // wins always win over deaths; tie-broken by score
  hs.sort((a,b)=>(b.won?1:0)-(a.won?1:0)||b.score-a.score);
  localStorage.setItem(HS_KEY,JSON.stringify(hs.slice(0,5)));
  return hs;
}
function saveHSInf(time){
  const hs=loadHSInf();
  hs.push({time,d:new Date().toLocaleDateString('fr')});
  hs.sort((a,b)=>b.time-a.time);
  localStorage.setItem(HS_INF_KEY,JSON.stringify(hs.slice(0,5)));
  return hs;
}function fmtTime(ms){const s=Math.floor(ms/1000),m=Math.floor(s/60),r=s%60;return m+':'+(r<10?'0':'')+r;}
function fmtDuration(ms){
  const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),r=s%60;
  if(h>0)return h+'h '+m+'m';
  if(m>0)return m+'m '+r+'s';
  return r+'s';
}

/* ── Stats ───────────────────────────────────── */
const STATS_KEY='theone_stats';
function loadStats(){
  try{return Object.assign({games:0,wins:0,rivals:0,timeNorm:0,timeInf:0},JSON.parse(localStorage.getItem(STATS_KEY)||'{}'));}
  catch{return{games:0,wins:0,rivals:0,timeNorm:0,timeInf:0};}
}
function saveStats(p){localStorage.setItem(STATS_KEY,JSON.stringify(p));return p;}
function recordGame({won,rivals,playT,infinite,helmets}){
  const s=loadStats();
  s.games++;if(won)s.wins++;s.rivals+=rivals||0;
  if(infinite)s.timeInf+=playT||0;else s.timeNorm+=playT||0;
  s.helmets=(s.helmets||0)+(helmets||0);
  // streak
  if(won){s.streak=(s.streak||0)+1;s.bestStreak=Math.max(s.bestStreak||0,s.streak);}
  else s.streak=0;
  // best win time
  if(won&&!infinite){if(!s.bestWinTime||playT<s.bestWinTime)s.bestWinTime=playT;}
  return saveStats(s);
}

// All achievements complete when get(s) >= target (or fmt:'speed' has special meaning)
function achComplete(a,s){
  const v=a.get(s)||0;
  if(a.fmt==='speed')return s.bestWinTime>0&&s.bestWinTime<=a.target;
  return v>=a.target;
}
const TIERS={easy:{label:'Facile',color:'#7ec88a'},medium:{label:'Moyen',color:'#e8b65a'},hard:{label:'Difficile',color:'#e07050'},extreme:{label:'Extrême',color:'#c050d0'}};

function checkAchievements(stats,bestInfTime,perGame={}){
  const s={...stats,bestInfTime:bestInfTime||0,...perGame};
  const ach=loadAch();let ml=loadML();let earned=[];
  for(const a of ACHIEVEMENTS){
    if(!ach.has(a.id)&&achComplete(a,s)){ach.add(a.id);ml+=a.ml;earned.push(a);}
  }
  if(earned.length){saveAch(ach);saveML(ml);}
  return{ach,ml,earned};
}

function checkWeekly(w,gameStats){
  w.ws.killsWeek=(w.ws.killsWeek||0)+(gameStats.killsInGame||0);
  w.ws.helmetsWeek=(w.ws.helmetsWeek||0)+(gameStats.helmetsInGame||0);
  w.ws.timeWeek=(w.ws.timeWeek||0)+(gameStats.playT||0);
  if(gameStats.won&&!gameStats.infinite)w.ws.winsWeek=(w.ws.winsWeek||0)+1;
  if((gameStats.bestZoneInGame||0)>=5)w.ws.zone5Week=(w.ws.zone5Week||0)+1;
  const earned=[];let ml=loadML();

    let val;
    if(tpl.key in w.ws)val=w.ws[tpl.key];

    const cmp=tpl.scale?c.target*tpl.scale:c.target;

    else if(tpl.mode==='lte')ok=val>0&&val<=cmp;
    if(ok){c.completed=true;ml+=c.ml;earned.push(c);}

function checkDaily(d,gameStats){
  // gameStats: {killsInGame, helmetsInGame, perfectWin, noHelmetWin, bestInfInGame, bestWinInGame, bestZoneInGame, won, infinite, playT}
  // Update daily cumulative
  d.ds.killsToday=(d.ds.killsToday||0)+(gameStats.killsInGame||0);
  d.ds.helmetsToday=(d.ds.helmetsToday||0)+(gameStats.helmetsInGame||0);
  d.ds.timeToday=(d.ds.timeToday||0)+(gameStats.playT||0);
  if(gameStats.won&&!gameStats.infinite)d.ds.winsToday=(d.ds.winsToday||0)+1;
  const earned=[];let ml=loadML();
  for(const c of d.ch){
    if(c.completed)continue;
    const tpl=CH_TEMPLATES.find(t=>t.id===c.tplId);if(!tpl)continue;
    let val;
    if(tpl.key in d.ds)val=d.ds[tpl.key];
    else val=gameStats[tpl.key]||0;
    const cmp=tpl.scale?c.target*tpl.scale:c.target;
    let ok=false;
    if(tpl.mode==='gte')ok=val>=cmp;
    else if(tpl.mode==='lte')ok=val>0&&val<=cmp;
    else if(tpl.mode==='eq')ok=val===cmp||val===true;
    if(ok){c.completed=true;ml+=c.ml;earned.push(c);}
  }
  if(earned.length)saveML(ml);
  saveDaily(d);
  return{d,earned,ml};

function effZD(g){
  if(g.infinite&&g.zone===4){
    const base=ZONES[3];const m=1+0.05*Math.floor(g.playT/30000);

    return{...base,dur:999,

      ms:[base.ms[0]/msm,base.ms[1]/msm],

}

/* ── SVG Components ─────────────────────────────────────── */
const f1=v=>Math.round(v*10)/10;
const hrnd=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s);};
// Closed smooth path through points (quadratic curves via midpoints)
function smoothClosed(pts){
  const n=pts.length;const pl=pts[n-1],p0=pts[0];
  let d=`M${f1((pl[0]+p0[0])/2)} ${f1((pl[1]+p0[1])/2)}`;
  for(let i=0;i<n;i++){const p=pts[i],q=pts[(i+1)%n];d+=`Q${f1(p[0])} ${f1(p[1])} ${f1((p[0]+q[0])/2)} ${f1((p[1]+q[1])/2)}`;}
  return d+'Z';
}
function smoothOpen(pts){
  let d=`M${f1(pts[0][0])} ${f1(pts[0][1])}`;
  for(let i=1;i<pts.length-1;i++){const p=pts[i],q=pts[i+1];d+=`Q${f1(p[0])} ${f1(p[1])} ${f1((p[0]+q[0])/2)} ${f1((p[1]+q[1])/2)}`;}
  const l=pts[pts.length-1];return d+`L${f1(l[0])} ${f1(l[1])}`;
}
function blobPts(cx,cy,n,rf){const a=[];for(let i=0;i<n;i++){const t=i/n*Math.PI*2,r=rf(i,t);a.push([cx+Math.cos(t)*r,cy+Math.sin(t)*r]);}return a;}
// Tapered ribbon along a polyline (tails)
function ribbon(pts,w0,w1){
  const n=pts.length,L=[],R=[];
  for(let i=0;i<n;i++){
    const a=pts[Math.max(0,i-1)],b=pts[Math.min(n-1,i+1)];
    let tx=b[0]-a[0],ty=b[1]-a[1];const l=Math.hypot(tx,ty)||1;tx/=l;ty/=l;
    const w=lerp(w0,w1,i/(n-1))/2;
    L.push(`${f1(pts[i][0]-ty*w)} ${f1(pts[i][1]+tx*w)}`);
    R.push(`${f1(pts[i][0]+ty*w)} ${f1(pts[i][1]-tx*w)}`);
  }
  return'M'+L.join('L')+'L'+R.reverse().join('L')+'Z';
}
const polyD=pts=>'M'+pts.map(p=>f1(p[0])+' '+f1(p[1])).join('L');

/* Living tunnel backdrop: parallax bokeh + undulating tissue walls + vignette */
// wide: 0 = walls hug the play lane, 1 = walls hug the window edges (menu)
function Backdrop({t,acc,ox,oy,vbW,vbH,wide=0}){
  const wl=lerp(POX,-ox,wide),wr=lerp(POX+PW,GW+ox,wide);
  const H=GH+240,X0=-ox,W=vbW;
  const layer=(n,seed,sp,rMin,rMax,op,fill)=>Array.from({length:n},(_,i)=>{
    const k=seed+i;
    const yy=((hrnd(k*3+1)*H+t*sp)%H)-120;
    const xx=X0+hrnd(k*3+2)*W+Math.sin(t*0.003+k)*14;
    const r=rMin+hrnd(k*3)*(rMax-rMin);
    return<circle key={k} cx={f1(xx)} cy={f1(yy)} r={f1(r)} fill={fill} opacity={op}/>;
  });
  const wall=(side,amp,ph,base)=>{
    const pts=[];
    for(let yy=-oy-40;yy<=GH+oy+40;yy+=24){
      const w=base+Math.sin((yy-t)*0.011+ph)*amp+Math.sin((yy-t)*0.029+ph*2)*amp*0.45;
      pts.push([side<0?wl+w:wr-w,yy]);
    }
    return pts;
  };
  const wallShape=(side,pts)=>{
    const edgeX=side<0?X0:X0+W;
    return smoothOpen(pts)+`L${f1(edgeX)} ${f1(pts[pts.length-1][1])}L${f1(edgeX)} ${f1(pts[0][1])}Z`;
  };
  const Lb=wall(-1,9,1.3,26),Lf=wall(-1,6,0,14),Rb=wall(1,9,2.1,26),Rf=wall(1,6,3.4,14);
  return(<g>
    {layer(6,100,0.22,55,115,0.22,'url(#bokeh)')}
    {layer(9,200,0.55,9,22,0.38,'url(#bokeh)')}
    <path d={wallShape(-1,Lb)} fill="url(#wallL)" opacity="0.55"/>
    <path d={wallShape(1,Rb)} fill="url(#wallR)" opacity="0.55"/>
    <path d={wallShape(-1,Lf)} fill="url(#wallL)"/>
    <path d={wallShape(1,Rf)} fill="url(#wallR)"/>
    <path d={smoothOpen(Lf)} fill="none" stroke={acc} strokeOpacity="0.14" strokeWidth="9"/>
    <path d={smoothOpen(Rf)} fill="none" stroke={acc} strokeOpacity="0.14" strokeWidth="9"/>
    <path d={smoothOpen(Lf)} fill="none" stroke={acc} strokeOpacity="0.6" strokeWidth="1.3"/>
    <path d={smoothOpen(Rf)} fill="none" stroke={acc} strokeOpacity="0.6" strokeWidth="1.3"/>
    {layer(16,300,1.25,0.8,2.2,0.5,'#ffe9e2')}
    <rect x={-ox} y={-oy} width={vbW} height={vbH} fill="url(#vign)"/>
  </g>);
}

        </g>;
      })}
      {/* Ice crystals */}
      {sk.id==='ice'&&[0,1,2,3,4,5,6].map(i=>{
        const cyc=ph*0.22+i*0.37;
        const tick=Math.floor(cyc);
        const seed=tick*19.7+i*11.3;
        const ang=(Math.sin(seed)*0.5+0.5)*Math.PI*2;
        const dist=PR+5+(Math.cos(seed*1.9)*0.5+0.5)*10;
        const fx=Math.cos(ang)*dist,fy=Math.sin(ang)*dist;
        const alpha=Math.sin((cyc%1)*Math.PI);
        const rot=seed*30%360;
        return<g key={i} transform={`translate(${fx},${fy}) rotate(${rot})`} opacity={alpha}>
          {[0,60,120].map(a=>(
            <g key={a} transform={`rotate(${a})`}>
              <line x1="0" y1="-3.8" x2="0" y2="3.8" stroke="#eef7ff" strokeWidth="1.1" strokeLinecap="round"/>

            </g>
          ))}
          <circle r="1" fill="#fff"/>
        </g>;
      })}
      {/* Tail: soft glow + tapered body + specular line */}
      {!DISCRETE_MODE&&<g>
        <path d={ribbon(pts,16,4)} fill={tailFill} opacity="0.16"/>
        <path d={ribbon(pts,8.5,0.9)} fill={tailFill}/>
        <path d={polyD(pts.slice(0,12))} stroke="#fff" strokeOpacity="0.5" strokeWidth="1.3" fill="none" strokeLinecap="round"/>

      {/* Contact shadow */}
      <ellipse cx="0" cy="4" rx={PR+1} ry={PR+2} fill="#000" opacity="0.16"/>

      </g>
      {/* Galaxy: twinkling stars inside the head */}
      {sk.galaxy&&Array.from({length:14},(_,i)=>{
        const a=hrnd(i+3)*Math.PI*2+ph*0.08,d=3+hrnd(i+17)*15;

      <ellipse cx="0" cy="0" rx={PR} ry={PR+1.5} fill="url(#headShade)" opacity={sk.ghost?0.55:(sk.bodyGrad?1:(sk.galaxy?0.5:0.8))}/>
      {/* Pearl / holo: iridescent sheen */}
      {sk.pearl&&<ellipse cx="0" cy="0" rx={PR} ry={PR+1.5} fill="url(#pearlSheen)" transform={`rotate(${(ph*12)%360})`}/>}
      {/* Chrome: reflection band sweeping across */}
      {sk.chrome&&<g>
        <clipPath id="chromeClip"><ellipse cx="0" cy="0" rx={PR} ry={PR+1.5}/></clipPath>
        <g clipPath="url(#chromeClip)">
          <rect x={-60+((ph*18)%120)} y="-30" width="14" height="60" fill="url(#chromeBand)" transform="rotate(25)"/>

      {/* Acrosome cap */}
      <path d="M -16.5 -11 Q 0 -31 16.5 -11 Q 0 -19 -16.5 -11 Z" fill="#fff" opacity="0.14"/>
      <ellipse cx="0" cy="0" rx={PR-0.8} ry={PR+0.7} fill="none" stroke="url(#rimIri)" strokeOpacity="0.75" strokeWidth="1.6"/>
      {/* Diamond sparkles */}
      {sk.sparkle&&[0,1,2,3,4,5,6,7].map(i=>{
        const cyc=ph*0.55+i*0.31;
        const tick=Math.floor(cyc);
        const seed=tick*23.7+i*13.5;
        const ang=(Math.sin(seed)*0.5+0.5)*Math.PI*2;
        const dist=PR+6+(Math.cos(seed*1.9)*0.5+0.5)*10;
        const fx=Math.cos(ang)*dist,fy=Math.sin(ang)*dist;
        const alpha=Math.sin((cyc%1)*Math.PI);

          <circle r="5" fill="url(#glowWhite)"/>

        </g>;
      })}

      <ellipse cx="-12.5" cy="8.5" rx="5.5" ry="3.4" fill={sk.cheek}/>
      <ellipse cx="12.5" cy="8.5" rx="5.5" ry="3.4" fill={sk.cheek}/>
      {eye(-7.5)}{eye(7.5)}

  );
}

/* Smug winner shown on the "Éliminé" screen — half-lidded side glance, raised brow, lopsided smirk */
function RivalVictor({wob}){
  const t=wob*0.04;
  const bob=Math.sin(t)*2.5;
  const tilt=-7+Math.sin(t*0.7)*3;
  const brow=Math.max(0,Math.sin(t*0.9))*1.8;    // right brow lifts now and then
  const look=Math.sin(t*0.5)*0.8;                  // pupils drift a little
  const pts=[];
  for(let i=0;i<=22;i++){const f=i/22;pts.push([Math.sin(wob*0.11+f*3.4)*f*13,-14-f*104]);}
  const SKIN='#f59c7c',LID='#e8866a',INK='#6e0f2e';
  // eye: lidTop = y of the eyelid edge at the outer/inner corner (local coords)
  const eye=(cx,side,lo,li)=>{
    const id='rvEye'+side;
    const ox=cx+side*6.4,ix=cx-side*6.4;
    return(<g>
      <clipPath id={id}><ellipse cx={cx} cy="0" rx="6.6" ry="7.4"/></clipPath>
      <ellipse cx={cx} cy="0" rx="6.6" ry="7.4" fill="url(#eyeWhite)"/>
      <g clipPath={`url(#${id})`}>
        <circle cx={cx-2.2+look} cy="2.6" r="4.6" fill="#c2185b"/>
        <circle cx={cx-2.2+look} cy="2.6" r="4.6" fill="url(#irisShade)"/>
        <circle cx={cx-2+look} cy="2.9" r="2.3" fill="#2a0012"/>
        <circle cx={cx-0.6+look} cy="1.2" r="1.3" fill="#fff"/>
        <path d={`M ${ox} ${lo} L ${ix} ${li} L ${ix} -9 L ${ox} -9 Z`} fill={LID}/>
        <path d={`M ${ox} ${lo} L ${ix} ${li} L ${ix} ${li+1.6} L ${ox} ${lo+1.6} Z`} fill="#000" opacity="0.12"/>
      </g>
      <path d={`M ${ox+side*0.8} ${lo-0.3} L ${ix} ${li}`} stroke={INK} strokeWidth="2.1" strokeLinecap="round"/>
      <path d={`M ${ox+side*0.8} ${lo-0.3} l ${side*2.2} ${-1.6}`} stroke={INK} strokeWidth="1.5" strokeLinecap="round"/>
    </g>);
  };
  return(
    <g transform={`translate(0,${bob}) rotate(${tilt})`}>
      {!DISCRETE_MODE&&<g>
        <path d={ribbon(pts,20,5)} fill="#ff8fa8" opacity="0.14"/>
        <path d={ribbon(pts,10,1.2)} fill="#f7a0b4"/>
        <path d={polyD(pts.slice(0,10))} stroke="#fff" strokeOpacity="0.45" strokeWidth="1.4" fill="none" strokeLinecap="round"/>
      </g>}
      <ellipse cx="0" cy="5" rx="25" ry="26" fill="#000" opacity="0.22"/>
      <ellipse cx="0" cy="0" rx="24" ry="25.5" fill={SKIN}/>
      <ellipse cx="0" cy="0" rx="24" ry="25.5" fill="url(#headShade)"/>
      <ellipse cx="0" cy="0" rx="23" ry="24.5" fill="none" stroke="url(#rimIri)" strokeOpacity="0.6" strokeWidth="1.4"/>
      {/* Cheeks — the right one pushed up by the smirk */}
      <ellipse cx="-14" cy="10" rx="5.5" ry="3.2" fill="#e8506e" opacity="0.28"/>
      <ellipse cx="14.5" cy="7.5" rx="6" ry="3.6" fill="#e8506e" opacity="0.38"/>
      {/* Eyes: heavy lids, glancing down-left at the loser */}
      <g transform="translate(0,-2)">
        {eye(-9,-1,-2.2,-0.8)}
        {eye(9,1,-3.6-brow*0.4,-2.4-brow*0.4)}
      </g>
      {/* Brows: left low & flat, right arched up */}
      <path d="M -17 -12.5 Q -10 -14.5 -3.5 -11.5" stroke={INK} strokeWidth="2.3" fill="none" strokeLinecap="round"/>
      <path d={`M 3.5 ${-14-brow} Q 10 ${-20.5-brow} 17 ${-15.5-brow*0.6}`} stroke={INK} strokeWidth="2.3" fill="none" strokeLinecap="round"/>
      {/* Lopsided smirk */}
      <path d="M -6.5 11 Q 1.5 13.6 9.5 7.2" stroke={INK} strokeWidth="2.3" fill="none" strokeLinecap="round"/>
      <path d="M 8.4 5.6 Q 10.6 6.6 10.4 9" stroke={INK} strokeWidth="1.5" fill="none" strokeLinecap="round"/>
      {/* Specular */}
      <ellipse cx="-6" cy="-20" rx="6" ry="2.8" fill="#fff" opacity="0.75" transform="rotate(-24,-6,-20)"/>
      <circle cx="-18.5" cy="-4" r="1.4" fill="#fff" opacity="0.55"/>
      {/* Victory glint */}
      <g transform={`translate(25,-22) scale(${0.8+Math.max(0,Math.sin(t*1.3))*0.5}) rotate(${(wob*0.5)%360})`} opacity={0.5+Math.max(0,Math.sin(t*1.3))*0.5}>
        <circle r="7" fill="url(#glowWhite)"/>
        <path d="M 0 -5 Q 0.6 -0.6 5 0 Q 0.6 0.6 0 5 Q -0.6 0.6 -5 0 Q -0.6 -0.6 0 -5 Z" fill="#fff"/>
      </g>
    </g>
  );
}

function arcPath(r,startA,endA){
  const x1=Math.cos(startA)*r,y1=Math.sin(startA)*r;
  const x2=Math.cos(endA)*r,y2=Math.sin(endA)*r;
  const sweep=((endA-startA)+Math.PI*4)%(Math.PI*2);
  return`M ${x1} ${y1} A ${r} ${r} 0 ${sweep>Math.PI?1:0} 1 ${x2} ${y2}`;
}
function Ovule({x,y,pulse,angle}){
  const entryA=angle||0;
  const gapH=Math.PI/3.2;
  const a0=entryA+gapH,a1=entryA-gapH+Math.PI*2;
  const entryX=Math.cos(entryA)*58,entryY=Math.sin(entryA)*58;
  const pg=0.6+Math.sin(pulse*0.15)*0.3;
  const N=24,span=a1-a0-0.24;
  return(
    <g transform={`translate(${x},${y})`}>
      <circle cx="0" cy="0" r={125+Math.sin(pulse*0.05)*8} fill="url(#glowGold)" opacity="0.6"/>
      {/* Corona radiata */}
      {Array.from({length:N},(_,i)=>{
        const a=a0+0.12+(i/(N-1))*span;
        const rr=69+Math.sin(pulse*0.05+i*1.3)*2.5+(i%2)*4;
        return<circle key={i} cx={f1(Math.cos(a)*rr)} cy={f1(Math.sin(a)*rr)} r={6+(i*7%3)} fill="url(#corona)"/>;
      })}
      {/* Zona pellucida */}
      <path d={arcPath(54,a0,a1)} fill="none" stroke="#ffe8b0" strokeOpacity="0.3" strokeWidth="11" strokeLinecap="round"/>
      <path d={arcPath(59.5,a0,a1)} fill="none" stroke="#fff4d6" strokeOpacity="0.8" strokeWidth="1.3" strokeLinecap="round"/>
      <path d={arcPath(48.5,a0,a1)} fill="none" stroke="#fff4d6" strokeOpacity="0.55" strokeWidth="1" strokeLinecap="round"/>
      {/* Cytoplasm */}
      <circle cx="0" cy="0" r="46" fill="url(#ovCyto)"/>
      {Array.from({length:18},(_,i)=>{const a=hrnd(i+7)*Math.PI*2,d=8+hrnd(i+31)*30;
        return<circle key={i} cx={f1(Math.cos(a)*d)} cy={f1(Math.sin(a)*d)} r={0.8+hrnd(i+53)*1.4} fill="#e7a647" opacity="0.35"/>;
      })}
      <circle cx="9" cy="-4" r="13" fill="url(#ovNuc)"/>
      <circle cx="11" cy="-6" r="3.4" fill="#eaa53c" opacity="0.7"/>
      <ellipse cx="-17" cy="-23" rx="14" ry="5.5" fill="#fff" opacity="0.6" transform="rotate(-38,-17,-23)"/>
      {/* Entry portal */}
      <circle cx={entryX} cy={entryY} r={22+Math.sin(pulse*0.18)*4} fill="url(#glowWhite)" opacity={pg}/>
      <circle cx={entryX} cy={entryY} r={9+Math.sin(pulse*0.18)*1.5} fill="none" stroke="#fff" strokeOpacity="0.7" strokeWidth="1.2"/>
      <circle cx={entryX} cy={entryY} r="4.5" fill="#fff"/>
    </g>
  );
}

function Ptcl({list}){

}

function Game(){
  const [safeArea,setSafeArea]=React.useState({sat:0,sab:0});
  const safeAreaRef=React.useRef({sat:0,sab:0});
  React.useEffect(()=>{
    const el=document.createElement('div');

    document.body.appendChild(el);
    const cs=getComputedStyle(el);
    const sat=parseFloat(cs.paddingTop)||0;
    const sab=parseFloat(cs.paddingBottom)||0;
    document.body.removeChild(el);
    if(sat||sab){setSafeArea({sat,sab});safeAreaRef.current={sat,sab};}
    // Retry après 200ms au cas où le viewport iOS n'est pas encore stabilisé
    const t=setTimeout(()=>{
      const el2=document.createElement('div');
      el2.style.cssText='position:fixed;top:0;left:0;width:0;height:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);pointer-events:none;visibility:hidden';
      document.body.appendChild(el2);
      const cs2=getComputedStyle(el2);
      const sat2=parseFloat(cs2.paddingTop)||0;
      const sab2=parseFloat(cs2.paddingBottom)||0;
      document.body.removeChild(el2);
      setSafeArea({sat:sat2,sab:sab2});safeAreaRef.current={sat:sat2,sab:sab2};
    },200);
    return()=>clearTimeout(t);
  },[]);
  const SAT=safeArea.sat;
  const SAB=safeArea.sab;
  const [screen,setScreen]=React.useState('start');
  const screenRef=React.useRef('start');
  const [highScores,setHighScores]=React.useState(loadHS);
  const [highScoresInf,setHighScoresInf]=React.useState(loadHSInf);
  const [infiniteUnlocked,setInfiniteUnlocked]=React.useState(()=>localStorage.getItem('theone_won')==='1');
  const [discreteMode,setDiscreteMode]=React.useState(()=>localStorage.getItem('theone_discrete')==='1');
  DISCRETE_MODE=discreteMode;
  const [muted,setMuted]=React.useState(()=>localStorage.getItem('theone_muted')==='1');
  const [shareImg,setShareImg]=React.useState(null);
  const [showInfo,setShowInfo]=React.useState(false);
  const [showStats,setShowStats]=React.useState(false);
  const [showAch,setShowAch]=React.useState(false);
  const [showShop,setShowShop]=React.useState(false);
  const [owned,setOwned]=React.useState(loadOwned);
  const [equipped,setEquipped]=React.useState(loadSkin);
  const equippedRef=React.useRef(equipped);
  React.useEffect(()=>{equippedRef.current=equipped;},[equipped]);
  const [stats,setStats]=React.useState(loadStats);

  const [mL,setML]=React.useState(loadML);
  const [achToast,setAchToast]=React.useState(null);
  const [daily,setDaily]=React.useState(loadDaily);
  const [weekly,setWeekly]=React.useState(loadWeekly);
  const [showDaily,setShowDaily]=React.useState(false);
  const [dailyToast,setDailyToast]=React.useState(null);
  const [,re]=React.useReducer(n=>n+1,0);
  const svgRef=React.useRef(null);
  const divRef=React.useRef(null);
  const vpRef=React.useRef({ox:0,oy:0,vbW:GW,vbH:GH});
  const raf=React.useRef(null);
  const touch=React.useRef(false);
  const gs=React.useRef(initState());

  // First-run tutorial (null = hidden) — the game loop is frozen while it shows
  const [tuto,setTuto]=React.useState(null);
  const tutoRef=React.useRef(null);
  function nextTuto(){
    const n=tutoRef.current+1;
    if(n>=TUTO_STEPS){localStorage.setItem(TUTO_KEY,'1');tutoRef.current=null;setTuto(null);}
    else{tutoRef.current=n;setTuto(n);}
  }
  // Landscape is not supported on phones: show a "rotate" screen and freeze the game
  const LAND_MQ='(orientation: landscape) and (pointer: coarse)';
  const [landscape,setLandscape]=React.useState(()=>window.matchMedia(LAND_MQ).matches);
  const landRef=React.useRef(landscape);
  React.useEffect(()=>{
    const mq=window.matchMedia(LAND_MQ);
    const h=()=>{
      landRef.current=mq.matches;setLandscape(mq.matches);
      // Layout constants are measured once at load: if we booted in landscape, reload once back in portrait
      if(!mq.matches&&GW>GH)location.reload();
    };
    mq.addEventListener?mq.addEventListener('change',h):mq.addListener(h);
    try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('portrait').catch(()=>{});}catch(e){}
    return()=>{mq.removeEventListener?mq.removeEventListener('change',h):mq.removeListener(h);};
  },[]);

  function setScreenBoth(s){screenRef.current=s;setScreen(s);if(s==='win'||s==='dead'||s==='start')stopAmbient();}

  function getPos(e){
    const el=svgRef.current;if(!el)return null;
    const r=el.getBoundingClientRect(),s=e.touches?e.touches[0]:e;
    const {ox,oy,vbW,vbH}=vpRef.current;
    return{
      x:clamp(-ox+(s.clientX-r.left)*(vbW/r.width),POX+22,POX+PW-22),
      y:clamp(-oy+(s.clientY-r.top)*(vbH/r.height),47+safeAreaRef.current.sat,GH-31),
    };
  }
  const onTS=e=>{_initAudio();touch.current=true;const p=getPos(e);if(p&&gs.current.phase==='playing'){gs.current.tx=p.x;gs.current.ty=p.y;}};
  const onTM=e=>{if(gs.current.phase==='playing')e.preventDefault();if(!touch.current)return;const p=getPos(e);if(p&&gs.current.phase==='playing'){gs.current.tx=p.x;gs.current.ty=p.y;}};
  const onTE=()=>touch.current=false;

  function startGame(infinite,hardcore){
    const s=initState();s.phase='playing';s.infinite=!!infinite;
    s.hardcore=!!hardcore;if(hardcore)s.lives=1;
    gs.current=s;setShareImg(null);setScreenBoth('playing');
    if(localStorage.getItem(TUTO_KEY)!=='1'){tutoRef.current=0;setTuto(0);}
    startAmbient();
  }

  async function shareScore(){
    try{
      const g=gs.current;const won=g.phase==='win';const inf=g.infinite;
      const CW=360,CH=640,cv=document.createElement('canvas');
      cv.width=CW;cv.height=CH;

      for(let i=0;i<14;i++){
        const bx0=hrnd(i*3+2)*CW,by0=hrnd(i*3+1)*CH,br=8+hrnd(i*3)*(i<5?70:22);
        const bg=ctx.createRadialGradient(bx0,by0,0,bx0,by0,br);
        bg.addColorStop(0,acc+'55');bg.addColorStop(0.5,acc+'1c');bg.addColorStop(1,acc+'00');
        ctx.fillStyle=bg;ctx.beginPath();ctx.arc(bx0,by0,br,0,Math.PI*2);ctx.fill();
      }
      const vg=ctx.createRadialGradient(CW/2,CH/2,CH*0.25,CW/2,CH/2,CH*0.75);
      vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.65)');
      ctx.fillStyle=vg;ctx.fillRect(0,0,CW,CH);

      ctx.shadowColor='rgba(255,111,145,0.6)';ctx.shadowBlur=24;
      ctx.fillStyle=tg;ctx.font='800 54px Sora,Helvetica Neue,Arial';ctx.fillText('TheOne',CW/2,82);

      halo.addColorStop(0,(sk.glow||acc)+'66');halo.addColorStop(1,(sk.glow||acc)+'00');
      ctx.fillStyle=halo;ctx.beginPath();ctx.arc(px,py,120,0,Math.PI*2);ctx.fill();
      const sprite=await new Promise(res=>{
        const host=document.createElement('div');const root=ReactDOM.createRoot(host);
        ReactDOM.flushSync(()=>root.render(
          <svg xmlns="http://www.w3.org/2000/svg" width="240" height="320" viewBox="-60 -70 120 160">

        im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
      });
      if(sprite)ctx.drawImage(sprite,px-120,py-140,240,320);
      // Score box
      const bx=CW/2-84,by=380;
      const _rr=(x,y,w,h,r)=>{ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();};
      ctx.fillStyle='rgba(255,255,255,0.07)';ctx.strokeStyle='rgba(255,255,255,0.18)';ctx.lineWidth=1;

  // Small per-run mL reward: 1 per 10 rivals, +15 for a win, +2 per 30 s survived in infinite mode
  function runReward(g,won){
    return Math.floor(g.score/10)+(won?15:0)+(g.infinite?Math.floor(g.playT/30000)*2:0);
  }

  // End of run (death or win): save scores/stats, check achievements & challenges, grant mL
  function finishRun(g,won){
    g.phase=won?'win':'dead';
    if(won)playSound('win');
    setScreenBoth(won?'win':'dead');
    try{
      if(won){localStorage.setItem('theone_won','1');setInfiniteUnlocked(true);}
      if(g.infinite){setHighScoresInf(saveHSInf(g.playT));}
      else{setHighScores(saveHS(g.score,won?4:g.zone,won));}
      const newStats=recordGame({won,rivals:g.score,playT:g.playT,infinite:g.infinite,helmets:g.helmetsPicked});
      setStats(newStats);
      const bestInf=loadHSInf()[0]?.time||0;
      const ac=checkAchievements(newStats,bestInf,won?{perfectWin:g.lives===3,noHelmetWin:g.helmetsPicked===0}:{});
      setAchSet(ac.ach);
      if(ac.earned.length)setAchToast(ac.earned);
      const gSt=won
        ?{killsInGame:g.score,helmetsInGame:g.helmetsPicked,bestZoneInGame:5,playT:g.playT,won:true,infinite:false,
          perfectWin:g.hardcore?(g.lives===1):g.lives===3,noHelmetWin:!g.hardcore&&g.helmetsPicked===0,bestWinInGame:g.playT}
        :{killsInGame:g.score,helmetsInGame:g.helmetsPicked,bestInfInGame:g.infinite?g.playT:0,bestZoneInGame:g.zone+1,
          playT:g.playT,won:false,infinite:g.infinite};
      const dr=checkDaily(loadDaily(),gSt);setDaily(dr.d);
      const wr=checkWeekly(loadWeekly(),gSt);setWeekly(wr.w);
      const allEarned=[...dr.earned,...wr.earned];
      if(allEarned.length)setDailyToast(allEarned);
      g.runML=runReward(g,won);
      setML(saveML(loadML()+g.runML));
    }catch(e){console.log(e);}
  }

  function burst(g,x,y,color,n=10){
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2,sp=1.5+Math.random()*3;
      g.ptcl.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:24+Math.random()*12,ml:36,color,id:uid()});
    }
  }

  // Individual enemy spawner — checks real-time lane occupancy to guarantee passage
  function spawnOne(g,zd,fz){
    const spd=lerp(zd.spd[0],zd.spd[1],fz);
    const type=zd.types[Math.floor(Math.random()*zd.types.length)];
    const minGaps=zd.minGaps||1;

    if(type==='sperm'){
      // Sperms come from bottom — check bottom occupancy
      const bOcc=new Set();
      g.sperms.filter(e=>e.y>GH-180).forEach(e=>bOcc.add(Math.floor(clamp((e.x-POX)/LW,0,LANES-1))));
      const bFree=Array.from({length:LANES},(_,i)=>i).filter(l=>!bOcc.has(l));
      if(bFree.length<1)return;
      const lane=bFree[Math.floor(Math.random()*bFree.length)];
      const lx=POX+(lane+0.5)*LW+(Math.random()-0.5)*LW*0.4;
      const spdVar=0.82+Math.random()*0.36;
      g.sperms.push({x:lx,y:GH+20+Math.random()*50,vx:(Math.random()-0.5)*0.7,svx:0,spd:spd*(zd.spermSpd||0.9)*spdVar,wob:Math.random()*100,id:uid()});
      return;
    }

    // Top-spawning enemies — check which lanes are free in spawn zone (y<240)
    const occ=new Set();
    [...g.mucus,...g.wbcs,...g.abs].filter(e=>e.y>-90&&e.y<240)
      .forEach(e=>occ.add(Math.floor(clamp((e.x-POX)/LW,0,LANES-1))));
    const free=Array.from({length:LANES},(_,i)=>i).filter(l=>!occ.has(l));
    // Must keep at least minGaps lanes free after placing
    const canFill=free.length-minGaps;
    if(canFill<1)return;
    // Shuffle free lanes, pick from first canFill
    const shuffled=[...free];
    for(let i=shuffled.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];}
    const lane=shuffled[Math.floor(Math.random()*canFill)];
    const lx=POX+(lane+0.5)*LW+(Math.random()-0.5)*LW*0.42;
    // Stagger y so enemies don't line up
    const yOff=-(15+Math.random()*55);
    if(type==='mucus')
      g.mucus.push({x:lx,y:yOff,spd:spd*0.5,r:20+Math.random()*10,pulse:Math.random()*100,id:uid()});
    else if(type==='wbc')
      g.wbcs.push({x:lx,y:yOff,spd:(spd*0.85+0.35)*(zd.wbcSpd||1),pulse:Math.random()*100,id:uid(),hom:0.004});
    else if(type==='antibody')
      g.abs.push({x:lx,y:yOff,spd:spd*1.1,angle:0,pulse:Math.random()*100,id:uid(),hom:0.013});
  }

  React.useEffect(()=>{
    const el=divRef.current;if(!el)return;
    const h=e=>{if(gs.current.phase==='playing')e.preventDefault();if(!touch.current)return;const p=getPos(e);if(p&&gs.current.phase==='playing'){gs.current.tx=p.x;gs.current.ty=p.y;}};
    el.addEventListener('touchmove',h,{passive:false});
    return()=>el.removeEventListener('touchmove',h);
  },[]);

  React.useEffect(()=>{
    let last=0;
    function tick(now){
      raf.current=requestAnimationFrame(tick); // ALWAYS re-queue first
      const dt=Math.min(now-last,40);last=now;
      const g=gs.current;
      // Always animate wob/pulse for menu/shop animations
      g.wob+=dt*0.1;g.pulse+=dt*0.08;g.drift=(g.drift||0)+dt*0.03;
      // Canal width eases between window-wide (home menu) and play-lane width
      const wideT=screenRef.current==='start'?1:0;
      g.wallMix=g.wallMix===undefined?1:lerp(g.wallMix,wideT,clamp(dt/180,0,1));
      if(g.phase!=='playing'){re();return;}
      if(tutoRef.current!==null||landRef.current){re();return;}
      if(g.inv>0)g.inv-=dt;
      if(g.hitFlash>0)g.hitFlash-=2;
      if(g.slowed>0)g.slowed-=dt;
      if(g.shield){g.shieldT-=dt;if(g.shieldT<=0)g.shield=false;}
      if(g.zoneAnn){g.zoneAnn.t-=dt;if(g.zoneAnn.t<=0)g.zoneAnn=null;}
      // Smooth bg blend between zones
      if(g.zoneBlend<1)g.zoneBlend=Math.min(1,g.zoneBlend+dt/1200);

      // Player
      const fs=g.slowed>0?0.07:0.17;
      const px0=g.px;
      g.px+=(g.tx-g.px)*fs*(dt/16);
      const py0=g.py;
      g.py+=(g.ty-g.py)*fs*(dt/16);
      const rawVx=g.px-px0;
      g.pvx=lerp(g.pvx||0,rawVx,clamp(0.12*(dt/16),0,1));
      // Skin trail particles
      const skTrail=(equippedRef.current&&getSkin(equippedRef.current).trail)||null;
      if(skTrail){
        const speed=Math.abs(rawVx)+Math.abs(g.py-py0);
        const rate=0.5+Math.min(speed*0.1,1.5);
        if(Math.random()<rate*(dt/100)){
          g.trail.push({x:g.px+(Math.random()-0.5)*10,y:g.py+(Math.random()-0.5)*10+8,life:35,ml:35,type:skTrail,seed:Math.random()*100,vy:0.3+Math.random()*0.4});
        }
      }
      g.trail=g.trail.filter(p=>p.life>0).map(p=>{p.life-=dt/16;p.y+=p.vy*(dt/16);return p;});

      // Scroll
      const zd=effZD(g);
      const fz=clamp(g.tiz/(zd.dur===999?60:zd.dur),0,1);
      g.bg=(g.bg+lerp(zd.scr[0],zd.scr[1],fz)*(dt/16))%GH;
      g.bgT=(g.bgT||0)+lerp(zd.scr[0],zd.scr[1],fz)*(dt/16);
      g.tiz+=dt/1000;
      g.playT+=dt;

      // Wave/rest — shorter rests
      g.waveT+=dt;
      if(g.waveOn&&g.waveT>=g.waveDur){
        g.waveT=0;
        if(g.zone===0){g.waveDur=4000+Math.random()*3500;} // zone 1 : pas de pause
        else{g.waveOn=false;g.restDur=g.zone>=3?(300+Math.random()*500):(800+Math.random()*1200);}
      }
      else if(!g.waveOn&&g.waveT>=g.restDur){g.waveOn=true;g.waveT=0;g.waveDur=g.zone>=3?(5500+Math.random()*3000):(4000+Math.random()*3500);}

      // Individual enemy spawn
      if(g.waveOn){
        g.spawnT+=dt;
        const ms=lerp(zd.ms[0],zd.ms[1],fz);
        while(g.spawnT>=ms){g.spawnT-=ms;spawnOne(g,zd,fz);}
      }
      g.lastHelmT+=dt;
      if(!g.hardcore&&!g.shield&&g.helmets.length<1&&g.lastHelmT>11000&&g.zone>=1&&Math.random()<0.00007*dt){
        g.helmets.push({x:POX+30+Math.random()*(PW-60),y:-45,pulse:0,id:uid(),hspd:1.172});
        g.lastHelmT=0;
      }

      // Move top→bottom enemies
      g.mucus=g.mucus.filter(m=>m.y<GH+70).map(m=>{m.y+=m.spd*(dt/16);m.x=clamp(m.x,POX+28,POX+PW-28);m.pulse+=dt*0.07;return m;});
      g.wbcs=g.wbcs.filter(w=>w.y<GH+70).map(w=>{
        w.y+=w.spd*(dt/16);w.x=clamp(w.x+(g.px-w.x)*w.hom*(dt/16),POX+28,POX+PW-28);w.pulse+=dt*0.08;return w;
      });
      g.abs=g.abs.filter(a=>a.y<GH+70).map(a=>{
        a.y+=a.spd*(dt/16);
        const dx=g.px-a.x,dy=g.py-a.y,dd=Math.sqrt(dx*dx+dy*dy)||1;
        a.x=clamp(a.x+dx/dd*a.hom*(dt/16)*a.spd*2.5,POX+28,POX+PW-28);
        a.angle=Math.atan2(dy,dx)*(180/Math.PI)+90;
        a.pulse+=dt*0.1;return a;
      });

      // Enemy sperms bottom→top; escaped = lose life
      const nextSperms=[];
      for(const e of g.sperms){
        e.y-=e.spd*(dt/16);e.x+=e.vx*(dt/16);
        if(e.x<POX+28||e.x>POX+PW-28)e.vx*=-1;
        e.x=clamp(e.x,POX+28,POX+PW-28);
        e.svx=lerp(e.svx!==undefined?e.svx:e.vx,e.vx,clamp(0.12*(dt/16),0,1));
        e.wob+=dt*0.08;
        if(e.y<-65){
          // escaped — penalise
          g.hitFlash=25;g.lives--;g.inv=900;
          if(g.lives<=0)playSound('dead');else playSound('hit');vibrate(60);
          burst(g,clamp(e.x,POX+20,POX+PW-20),15,P.rose,8);
          if(g.lives<=0){finishRun(g,false);return;}
        } else if(d2(g.px,g.py,e.x,e.y)<PR+15){
          burst(g,e.x,e.y,'#e89870',10);g.score++;vibrate(15);playSound('kill');
        } else {
          nextSperms.push(e);
        }
      }
      g.sperms=nextSperms;

      // Helmets
      g.helmets=g.helmets.filter(h=>h.y<GH+60).map(h=>{h.y+=(h.hspd||1.035)*(dt/16);h.pulse+=dt*0.08;return h;});
      g.ptcl=g.ptcl.filter(p=>p.life>0).map(p=>{p.x+=p.vx*(dt/16);p.y+=p.vy*(dt/16);p.vy+=0.08;p.life-=dt/16;return p;});

      // Mucus slow
      for(let i=g.mucus.length-1;i>=0;i--){
        if(d2(g.px,g.py,g.mucus[i].x,g.mucus[i].y)<PR+g.mucus[i].r-5){
          if(g.slowed<=0)burst(g,g.mucus[i].x,g.mucus[i].y,'#aae030',7);
          playSound('slow');
          g.slowed=1400;g.mucus.splice(i,1);break;
        }
      }

      // WBC/Antibody hit
      if(g.inv<=0){
        const hl=[...g.wbcs.map(w=>({...w,_t:'wbc'})),...g.abs.map(a=>({...a,_t:'ab'}))];
        for(const e of hl){
          if(d2(g.px,g.py,e.x,e.y)<PR+(e._t==='wbc'?27:21)){
            if(g.shield){
              g.shield=false;burst(g,e.x,e.y,'#f5c842',14);g.inv=500;
              if(e._t==='wbc')g.wbcs=g.wbcs.filter(w=>w.id!==e.id);
              else g.abs=g.abs.filter(a=>a.id!==e.id);
            }else{
              g.hitFlash=30;g.lives--;g.inv=1800;
              if(g.lives<=0)playSound('dead');else playSound('hit');vibrate(60);
              burst(g,e.x,e.y,e._t==='wbc'?'#88ccff':'#6090e0',12);
              if(e._t==='wbc')g.wbcs=g.wbcs.filter(w=>w.id!==e.id);
              else g.abs=g.abs.filter(a=>a.id!==e.id);
              if(g.lives<=0){finishRun(g,false);return;}
            }
            break;
          }
        }
      }

      // Helmet pickup
      for(let i=g.helmets.length-1;i>=0;i--){
        if(d2(g.px,g.py,g.helmets[i].x,g.helmets[i].y)<PR+22){
          g.shield=true;g.shieldT=8000;burst(g,g.helmets[i].x,g.helmets[i].y,'#f5c842',16);g.helmetsPicked++;g.helmets.splice(i,1);
        }
      }

      // Zone advance — seamless, no pause
      if(g.zone<ZONES.length-1&&g.tiz>=ZONES[g.zone].dur){
        g.prevZone=g.zone;g.zone++;g.tiz=0;g.zoneBlend=0;
        g.waveOn=true;g.waveT=0;g.spawnT=0;
        // Don't clear existing enemies — let them naturally exit for continuity
        const nz=ZONES[g.zone];
        g.zoneAnn={name:g.infinite&&g.zone===4?'Mode Infini':nz.name,dname:g.infinite&&g.zone===4?'Mode Infini':nz.dname,emoji:g.infinite&&g.zone===4?'∞':nz.emoji,demoji:g.infinite&&g.zone===4?'∞':nz.demoji,t:2000};
      }

      // Zone 5 ovule — rotating with single entry (skipped in infinite mode)
      if(g.zone===4&&!g.infinite){
        if(g.tiz>5)g.ovuleY=clamp(-160+(g.tiz-5)*22,-160,100);
        g.ovuleAngle=(g.ovuleAngle+0.0018*dt)%(Math.PI*2);
        if(g.ovuleY>=80){
          const dd=d2(g.px,g.py,GW/2,g.ovuleY);
          const gapH=Math.PI/3.2;
          const pA=Math.atan2(g.py-g.ovuleY,g.px-GW/2);
          let diff=Math.abs(pA-g.ovuleAngle)%(Math.PI*2);
          if(diff>Math.PI)diff=Math.PI*2-diff;
          const inEntry=diff<gapH;
          // The membrane is always solid (even while invulnerable): only the rotating gap lets you in.
          // A contact costs a life (or the helmet), then the usual invulnerability avoids losing several in a row.
          if(dd<PR+62&&!inEntry){
            const nx=(g.px-GW/2)/(dd||1),ny=(g.py-g.ovuleY)/(dd||1);
            g.px=GW/2+nx*(PR+62);g.py=g.ovuleY+ny*(PR+62);
            g.tx=g.px+nx*28;g.ty=g.py+ny*28;
            if(g.inv<=0){
              if(g.shield){g.shield=false;burst(g,GW/2,g.ovuleY,'#f5c842',14);g.inv=500;}
              else{
                g.hitFlash=30;g.lives--;g.inv=1800;
                if(g.lives<=0)playSound('dead');else playSound('hit');vibrate(60);
                if(g.lives<=0){finishRun(g,false);return;}
              }
            }
          }
          {const bx=GW/2+Math.cos(g.ovuleAngle)*58,by=g.ovuleY+Math.sin(g.ovuleAngle)*58;
          if(d2(g.px,g.py,bx,by)<PR+20){
            burst(g,GW/2,g.ovuleY,'#ffd700',40);
            finishRun(g,true);return;
          }}
        }
      }

      re();
    }
    raf.current=requestAnimationFrame(tick);
    return()=>cancelAnimationFrame(raf.current);
  },[]);

  const g=gs.current;
  const z=effZD(g);
  const pz=ZONES[g.prevZone||0]||ZONES[0];
  const fz=clamp(g.tiz/(z.dur===999?60:z.dur),0,1);
  const totalProg=g.infinite&&g.zone===4?1:clamp((g.zone+(z.dur===999?0.99:fz))/ZONES.length,0,1);
  const bgl=lerpHex(pz.bg1,z.bg1,g.zoneBlend||1);
  const bgd=lerpHex(pz.bg2,z.bg2,g.zoneBlend||1);
  const bgLines=Array.from({length:16},(_,i)=>((g.bg+i*(GH/16))%GH));

  // CSS filter for hit flash
  const hitCss='none'; // hit feedback is now an in-SVG red vignette (cheaper than a CSS filter)

  const _vpS=Math.min(window.innerWidth/GW,window.innerHeight/GH);
  const _vpW=window.innerWidth/_vpS,_vpH=window.innerHeight/_vpS;
  vpRef.current={ox:(_vpW-GW)/2,oy:(_vpH-GH)/2,vbW:_vpW,vbH:_vpH};
  const {ox,oy,vbW,vbH}=vpRef.current;

  // Height-adaptive menu layout: buttons anchored to the bottom, score lists keep only the rows that fit
  const LY=(()=>{
    const btm=GH-SAB;
    const s2Y=btm-14-32, playY=s2Y-12-56;
    const infHdrY=highScoresInf.length>0?playY-60:null;
    const hsY=GH*0.56;
    const hsRows=clamp(Math.floor(((infHdrY===null?playY:infHdrY)-14-(hsY+5))/44),0,3);
    const heroY=SAT+clamp(GH*0.2,80,170);
    const titleY=heroY+clamp(GH*0.19,95,150);
    const cardY=titleY+46, dScoresY=cardY+92;
    const menuY=btm-20, infY=menuY-48;
    const retryY=(infiniteUnlocked?infY-14:menuY-26)-52;
    const dRows=clamp(Math.floor((retryY-12-(dScoresY+5))/38),0,3);
    return{s2Y,playY,infHdrY,hsY,hsRows,heroY,titleY,cardY,dScoresY,menuY,infY,retryY,dRows};
  })();

  return(
    <div ref={divRef} className="gw" style={{filter:hitCss}}
      onMouseDown={onTS} onMouseMove={onTM} onMouseUp={onTE}
      onTouchStart={onTS} onTouchEnd={onTE}
    >
      <svg ref={svgRef} viewBox={`${-ox} ${-oy} ${vbW} ${vbH}`} preserveAspectRatio="none" style={{touchAction:screen==='playing'?'none':'auto'}}>
        <defs>
          <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={bgl}/><stop offset="100%" stopColor={bgd}/>
          </linearGradient>
          <FxDefs acc={z.acc}/>
        </defs>

        <rect x={-ox} y={-oy} width={vbW} height={vbH} fill="url(#bgG)"/>
        <Backdrop t={(g.bgT||0)+(g.drift||0)} acc={z.acc} ox={ox} oy={oy} vbW={vbW} vbH={vbH} wide={g.wallMix??1}/>
        {/* Side darkening outside play zone (fades out while the canal is window-wide) */}
        {POX+ox>0&&<rect x={-ox} y={-oy} width={POX+ox} height={vbH} fill="rgba(0,0,0,0.45)" opacity={1-(g.wallMix??1)}/>}
        {POX+ox>0&&<rect x={POX+PW} y={-oy} width={ox+GW-(POX+PW)} height={vbH} fill="rgba(0,0,0,0.45)" opacity={1-(g.wallMix??1)}/>}

        {/* Ovule */}
        {g.zone===4&&g.ovuleY>-130&&<Ovule x={GW/2} y={g.ovuleY} pulse={g.pulse} angle={g.ovuleAngle}/>}

        <Ptcl list={g.ptcl}/>

        {g.mucus.map(m=><Mucus key={m.id} x={m.x} y={m.y} pulse={m.pulse} r={m.r}/>)}
        {g.wbcs.map(w=><WBC key={w.id} x={w.x} y={w.y} pulse={w.pulse}/>)}
        {g.abs.map(a=><Antibody key={a.id} x={a.x} y={a.y} angle={a.angle} pulse={a.pulse}/>)}
        {g.sperms.map(e=><SpermEnemy key={e.id} x={e.x} y={e.y} wob={e.wob} vx={e.vx} svx={e.svx}/>)}
        {g.helmets.map(h=><Helmet key={h.id} x={h.x} y={h.y} pulse={h.pulse}/>)}

        {/* Player & skin trail */}
        {screen==='playing'&&(<React.Fragment>
          {g.trail.map(p=>{
            const a=Math.max(0,p.life/p.ml);
            if(p.type==='fire')return<g key={p.seed} opacity={a*0.9}><circle cx={p.x} cy={p.y} r={7*a+2} fill="url(#sk_fire)"/><ellipse cx={p.x} cy={p.y} rx={2.6*a+1} ry={4.4*a+1} fill="#ff7a2a"/><ellipse cx={p.x} cy={p.y-0.5} rx={1.2*a} ry={2.2*a} fill="#ffe27a"/></g>;
            if(p.type==='ice')return<g key={p.seed} transform={`translate(${p.x},${p.y}) rotate(${p.seed*7})`} opacity={a*0.9}>{[0,60,120].map(an=>(<g key={an} transform={`rotate(${an})`}><line x1="0" y1="-2.6" x2="0" y2="2.6" stroke="#eef7ff" strokeWidth={1.1*a+0.3} strokeLinecap="round"/></g>))}</g>;
            if(p.type==='diamond')return<g key={p.seed} transform={`translate(${p.x},${p.y}) scale(${0.6+a*0.5})`} opacity={a}><circle r="4" fill="url(#glowWhite)"/><path d="M 0 -3.2 Q 0.4 -0.4 3.2 0 Q 0.4 0.4 0 3.2 Q -0.4 0.4 -3.2 0 Q -0.4 -0.4 0 -3.2 Z" fill="#fff"/></g>;
            if(p.type==='neon')return<g key={p.seed}><circle cx={p.x} cy={p.y} r={6*a+1} fill="url(#sk_neon)" opacity={a}/><circle cx={p.x} cy={p.y} r={1.8*a+0.6} fill="#c8fff4" opacity={a}/></g>;
            if(p.type==='toxic')return<g key={p.seed} opacity={a}><circle cx={p.x} cy={p.y} r={3.5*(1.4-a)+1.5} fill="#c4f24a" fillOpacity="0.15" stroke="#d8fa7a" strokeWidth="1"/><circle cx={p.x-1} cy={p.y-1} r="0.8" fill="#fff"/></g>;
            if(p.type==='aurora')return<circle key={p.seed} cx={p.x} cy={p.y} r={7*a+2} fill={Math.floor(p.seed)%2?'url(#sk_aurora)':'url(#glowBlue)'} opacity={a}/>;
            if(p.type==='stars')return<g key={p.seed} transform={`translate(${p.x},${p.y}) scale(${0.5+a*0.6}) rotate(${p.seed*9})`} opacity={a}><circle r="4" fill="url(#sk_galaxy)"/><path d="M 0 -3.5 Q 0.4 -0.4 3.5 0 Q 0.4 0.4 0 3.5 Q -0.4 0.4 -3.5 0 Q -0.4 -0.4 0 -3.5 Z" fill={Math.floor(p.seed)%3?'#fff':'#ffb8f0'}/></g>;
            if(p.type==='gold')return<g key={p.seed} transform={`translate(${p.x},${p.y}) scale(${0.5+a*0.6})`} opacity={a}><circle r="5" fill="url(#glowGold)"/><path d="M 0 -3.2 L 1 -1 L 3.2 0 L 1 1 L 0 3.2 L -1 1 L -3.2 0 L -1 -1 Z" fill="#ffe08a"/></g>;
            if(p.type==='holo'){const c=['#ffc6ec','#c6e8ff','#d8ffd6','#e2c9ff','#ffd9c2'];return<g key={p.seed}><circle cx={p.x} cy={p.y} r={6*a+1} fill="url(#glowWhite)" opacity={a*0.6}/><circle cx={p.x} cy={p.y} r={2.4*a+0.8} fill={c[Math.floor(p.seed)%5]} opacity={a}/></g>;}
            if(p.type==='rainbow'){const c=['#ff5a7a','#ffa45c','#ffd95e','#7ee0a0','#5fb4ff','#8a7bff','#d77bff'];return<circle key={p.seed} cx={p.x} cy={p.y} r={2.5*a+1} fill={c[Math.floor(p.seed)%7]} opacity={a*0.85}/>;}
            return null;

                  const unlocked=achSet.has(a.id);
                  const sExt={...stats,bestInfTime:highScoresInf[0]?.time||0};
                  const val=a.get(sExt)||0;
                  const tgt=a.target;
                  let pct=unlocked?1:clamp(val/tgt,0,1);
                  let progressTxt;
                  if(unlocked){progressTxt='Débloqué';}
                  else if(a.fmt==='time'){progressTxt=fmtDuration(val)+' / '+fmtDuration(tgt);}
                  else if(a.fmt==='speed'){
                    progressTxt=sExt.bestWinTime>0?('Record : '+fmtTime(sExt.bestWinTime)+' / '+fmtTime(tgt)):('Cible : '+fmtTime(tgt));
                    pct=sExt.bestWinTime>0?clamp(tgt/sExt.bestWinTime,0,1):0;
                  }
                  else{progressTxt=val+' / '+tgt;}
                  return(
                    <div key={a.id} style={{padding:'8px 10px',marginBottom:5,borderRadius:10,background:unlocked?'rgba(245,200,66,0.08)':'rgba(255,255,255,0.025)',border:`1px solid ${unlocked?'rgba(245,200,66,0.3)':'rgba(220,160,120,0.08)'}`}}>
                      <div style={{display:'flex',alignItems:'flex-start'}}>
                        <div style={{width:28,height:28,borderRadius:'50%',background:unlocked?TIERS[tier].color:'rgba(255,255,255,0.05)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,marginRight:10,color:unlocked?'white':'rgba(255,255,255,0.3)',flexShrink:0}}>{unlocked?'✓':'·'}</div>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontSize:13,fontWeight:600,color:unlocked?'rgba(230,200,180,0.95)':'rgba(180,150,130,0.5)'}}>{a.name}</div>
                          <div style={{fontSize:10,color:unlocked?'rgba(190,160,140,0.6)':'rgba(150,125,110,0.4)',marginTop:2}}>{a.desc}</div>
                        </div>
                        <div style={{fontSize:12,fontWeight:700,color:unlocked?P.rose:'rgba(180,140,140,0.35)',whiteSpace:'nowrap',marginLeft:8,marginTop:2,flexShrink:0}}>+{a.ml} mL</div>
                      </div>
                      <div style={{marginTop:7,marginLeft:38}}>
                        <div style={{height:4,background:'rgba(255,255,255,0.06)',borderRadius:2,overflow:'hidden'}}>
                          <div style={{height:'100%',width:(pct*100)+'%',background:unlocked?'#7ec88a':TIERS[tier].color,borderRadius:2,transition:'width .3s'}}></div>
                        </div>
                        <div style={{fontSize:9.5,color:'rgba(180,150,130,0.5)',marginTop:3}}>{progressTxt}</div>
                      </div>
                    </div>
                  );
                })}
              </div>
            ))}
            <div style={{height:20}}></div>
          </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Game/>);
</script>

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
