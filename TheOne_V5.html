/* ── High scores ─────────────────────────────────────────── */
const HS_KEY='theone_hs';
const HS_INF_KEY='theone_hs_inf';
function loadHS(){try{return JSON.parse(localStorage.getItem(HS_KEY)||'[]');}catch{return[];}}
function loadHSInf(){try{return JSON.parse(localStorage.getItem(HS_INF_KEY)||'[]');}catch{return[];}}
function saveHS(score,zone,won){
  const hs=loadHS();
  hs.push({score,zone,won:!!won,d:new Date().toLocaleDateString('fr')});
  // wins always win over deaths; tie-broken by score
  hs.sort((a,b)=>(b.won?1:0)-(a.won?1:0)||b.score-a.score);
  localStorage.setItem(HS_KEY,JSON.stringify(hs.slice(0,5)));
  return hs;
}
function saveHSInf(time){
  const hs=loadHSInf();
  hs.push({time,d:new Date().toLocaleDateString('fr')});
  hs.sort((a,b)=>b.time-a.time);
  localStorage.setItem(HS_INF_KEY,JSON.stringify(hs.slice(0,5)));
  return hs;
}function fmtTime(ms){const s=Math.floor(ms/1000),m=Math.floor(s/60),r=s%60;return m+':'+(r<10?'0':'')+r;}
function fmtDuration(ms){
  const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),r=s%60;
  if(h>0)return h+'h '+m+'m';
  if(m>0)return m+'m '+r+'s';
  return r+'s';
}

/* ── Stats ───────────────────────────────────── */
const STATS_KEY='theone_stats';
function loadStats(){
  try{return Object.assign({games:0,wins:0,rivals:0,timeNorm:0,timeInf:0},JSON.parse(localStorage.getItem(STATS_KEY)||'{}'));}
  catch{return{games:0,wins:0,rivals:0,timeNorm:0,timeInf:0};}
}
function saveStats(p){localStorage.setItem(STATS_KEY,JSON.stringify(p));return p;}
function recordGame({won,rivals,playT,infinite,helmets}){
  const s=loadStats();
  s.games++;if(won)s.wins++;s.rivals+=rivals||0;
  if(infinite)s.timeInf+=playT||0;else s.timeNorm+=playT||0;
  s.helmets=(s.helmets||0)+(helmets||0);
  // streak
  if(won){s.streak=(s.streak||0)+1;s.bestStreak=Math.max(s.bestStreak||0,s.streak);}
  else s.streak=0;
  // best win time
  if(won&&!infinite){if(!s.bestWinTime||playT<s.bestWinTime)s.bestWinTime=playT;}
  return saveStats(s);
}

// All achievements complete when get(s) >= target (or fmt:'speed' has special meaning)
function achComplete(a,s){
  const v=a.get(s)||0;
  if(a.fmt==='speed')return s.bestWinTime>0&&s.bestWinTime<=a.target;
  return v>=a.target;
}
const TIERS={easy:{label:'Facile',color:'#7ec88a'},medium:{label:'Moyen',color:'#e8b65a'},hard:{label:'Difficile',color:'#e07050'},extreme:{label:'Extrême',color:'#c050d0'}};

function checkAchievements(stats,bestInfTime){
  const s={...stats,bestInfTime:bestInfTime||0};
  const ach=loadAch();let ml=loadML();let earned=[];
  for(const a of ACHIEVEMENTS){
    if(!ach.has(a.id)&&achComplete(a,s)){ach.add(a.id);ml+=a.ml;earned.push(a);}
  }
  if(earned.length){saveAch(ach);saveML(ml);}
  return{ach,ml,earned};
}

function strHash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function mulberry32(seed){let s=seed;return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function generateDaily(){
  const id=dayId(),seed=strHash(id),rand=mulberry32(seed);
  const tiers=['easy','medium','hard'];
  const picked=[];
  for(const t of tiers){
    const opts=CH_TEMPLATES.filter(c=>c.t===t);
    const tpl=opts[Math.floor(rand()*opts.length)];
    const target=tpl.pool[Math.floor(rand()*tpl.pool.length)];
    picked.push({id:tpl.id+'_'+t,tplId:tpl.id,t,target,ml:tpl.ml,fmt:tpl.fmt(target),completed:false});
  }
  return picked;
}

  const fresh={date:dayId(),ch:generateDaily(),ds:{killsToday:0,helmetsToday:0,timeToday:0,winsToday:0}};

function weekId(){
  const d=new Date();const tz=d.getTimezoneOffset()*60000;

];
function generateWeekly(){
  const id=weekId(),seed=strHash('w'+id),rand=mulberry32(seed);
  const pool=[...WK_TEMPLATES];
  const picked=[];
  for(let i=0;i<2;i++){
    const idx=Math.floor(rand()*pool.length);
    const tpl=pool.splice(idx,1)[0];
    const target=tpl.pool[Math.floor(rand()*tpl.pool.length)];
    picked.push({id:tpl.id+'_'+i,tplId:tpl.id,target,ml:tpl.ml,fmt:tpl.fmt(target),completed:false});
  }
  return picked;
}
function loadWeekly(){
  try{
    const w=JSON.parse(localStorage.getItem(WEEKLY_KEY)||'null');
    if(w&&w.wid===weekId())return w;
  }catch{}
  const fresh={wid:weekId(),ch:generateWeekly(),ws:{killsWeek:0,helmetsWeek:0,timeWeek:0,winsWeek:0,zone5Week:0}};
  localStorage.setItem(WEEKLY_KEY,JSON.stringify(fresh));

  w.ws.killsWeek=(w.ws.killsWeek||0)+(gameStats.killsInGame||0);
  w.ws.helmetsWeek=(w.ws.helmetsWeek||0)+(gameStats.helmetsInGame||0);
  w.ws.timeWeek=(w.ws.timeWeek||0)+(gameStats.playT||0);
  if(gameStats.won&&!gameStats.infinite)w.ws.winsWeek=(w.ws.winsWeek||0)+1;
  if((gameStats.bestZoneInGame||0)>=5)w.ws.zone5Week=(w.ws.zone5Week||0)+1;
  const earned=[];let ml=loadML();
  for(const c of w.ch){
    if(c.completed)continue;
    const tpl=WK_TEMPLATES.find(t=>t.id===c.tplId);if(!tpl)continue;
    let val;
    if(tpl.key in w.ws)val=w.ws[tpl.key];
    else val=gameStats[tpl.key]||0;
    const cmp=tpl.scale?c.target*tpl.scale:c.target;
    let ok=false;
    if(tpl.mode==='gte')ok=val>=cmp;
    else if(tpl.mode==='lte')ok=val>0&&val<=cmp;
    if(ok){c.completed=true;ml+=c.ml;earned.push(c);}
  }
  if(earned.length)saveML(ml);
  saveWeekly(w);
  return{w,earned,ml};
}

function checkDaily(d,gameStats){
  // gameStats: {killsInGame, helmetsInGame, perfectWin, noHelmetWin, bestInfInGame, bestWinInGame, bestZoneInGame, won, infinite, playT}
  // Update daily cumulative
  d.ds.killsToday=(d.ds.killsToday||0)+(gameStats.killsInGame||0);
  d.ds.helmetsToday=(d.ds.helmetsToday||0)+(gameStats.helmetsInGame||0);
  d.ds.timeToday=(d.ds.timeToday||0)+(gameStats.playT||0);
  if(gameStats.won&&!gameStats.infinite)d.ds.winsToday=(d.ds.winsToday||0)+1;
  const earned=[];let ml=loadML();
  for(const c of d.ch){
    if(c.completed)continue;
    const tpl=CH_TEMPLATES.find(t=>t.id===c.tplId);if(!tpl)continue;
    let val;
    if(tpl.key in d.ds)val=d.ds[tpl.key];
    else val=gameStats[tpl.key]||0;
    const cmp=tpl.scale?c.target*tpl.scale:c.target;
    let ok=false;
    if(tpl.mode==='gte')ok=val>=cmp;
    else if(tpl.mode==='lte')ok=val>0&&val<=cmp;
    else if(tpl.mode==='eq')ok=val===cmp||val===true;
    if(ok){c.completed=true;ml+=c.ml;earned.push(c);}
  }
  if(earned.length)saveML(ml);
  saveDaily(d);
  return{d,earned,ml};
}

function arcPath(r,startA,endA){
  const x1=Math.cos(startA)*r,y1=Math.sin(startA)*r;
  const x2=Math.cos(endA)*r,y2=Math.sin(endA)*r;
  const sweep=((endA-startA)+Math.PI*4)%(Math.PI*2);
  return`M ${x1} ${y1} A ${r} ${r} 0 ${sweep>Math.PI?1:0} 1 ${x2} ${y2}`;
}

  function burst(g,x,y,color,n=10){
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2,sp=1.5+Math.random()*3;
      g.ptcl.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:24+Math.random()*12,ml:36,color,id:uid()});
    }
  }

  // Individual enemy spawner — checks real-time lane occupancy to guarantee passage
  function spawnOne(g,zd,fz){
    const spd=lerp(zd.spd[0],zd.spd[1],fz);
    const type=zd.types[Math.floor(Math.random()*zd.types.length)];
    const minGaps=zd.minGaps||1;

    if(type==='sperm'){
      // Sperms come from bottom — check bottom occupancy
      const bOcc=new Set();
      g.sperms.filter(e=>e.y>GH-180).forEach(e=>bOcc.add(Math.floor(clamp((e.x-POX)/LW,0,LANES-1))));
      const bFree=Array.from({length:LANES},(_,i)=>i).filter(l=>!bOcc.has(l));
      if(bFree.length<1)return;
      const lane=bFree[Math.floor(Math.random()*bFree.length)];
      const lx=POX+(lane+0.5)*LW+(Math.random()-0.5)*LW*0.4;
      const spdVar=0.82+Math.random()*0.36;
      g.sperms.push({x:lx,y:GH+20+Math.random()*50,vx:(Math.random()-0.5)*0.7,svx:0,spd:spd*(zd.spermSpd||0.9)*spdVar,wob:Math.random()*100,id:uid()});
      return;
    }

    // Top-spawning enemies — check which lanes are free in spawn zone (y<240)
    const occ=new Set();
    [...g.mucus,...g.wbcs,...g.abs].filter(e=>e.y>-90&&e.y<240)
      .forEach(e=>occ.add(Math.floor(clamp((e.x-POX)/LW,0,LANES-1))));
    const free=Array.from({length:LANES},(_,i)=>i).filter(l=>!occ.has(l));
    // Must keep at least minGaps lanes free after placing
    const canFill=free.length-minGaps;
    if(canFill<1)return;
    // Shuffle free lanes, pick from first canFill
    const shuffled=[...free];
    for(let i=shuffled.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];}
    const lane=shuffled[Math.floor(Math.random()*canFill)];
    const lx=POX+(lane+0.5)*LW+(Math.random()-0.5)*LW*0.42;
    // Stagger y so enemies don't line up
    const yOff=-(15+Math.random()*55);
    if(type==='mucus')
      g.mucus.push({x:lx,y:yOff,spd:spd*0.5,r:20+Math.random()*10,pulse:Math.random()*100,id:uid()});
    else if(type==='wbc')
      g.wbcs.push({x:lx,y:yOff,spd:spd*0.85+0.35,pulse:Math.random()*100,id:uid(),hom:0.004});
    else if(type==='antibody')
      g.abs.push({x:lx,y:yOff,spd:spd*1.1,angle:0,pulse:Math.random()*100,id:uid(),hom:0.013});
  }

  React.useEffect(()=>{
    const el=divRef.current;if(!el)return;
    const h=e=>{if(gs.current.phase==='playing')e.preventDefault();if(!touch.current)return;const p=getPos(e);if(p&&gs.current.phase==='playing'){gs.current.tx=p.x;gs.current.ty=p.y;}};
    el.addEventListener('touchmove',h,{passive:false});
    return()=>el.removeEventListener('touchmove',h);
  },[]);

  React.useEffect(()=>{
    let last=0;
    function tick(now){
      raf.current=requestAnimationFrame(tick); // ALWAYS re-queue first
      const dt=Math.min(now-last,40);last=now;
      const g=gs.current;
      // Always animate wob/pulse for menu/shop animations
      g.wob+=dt*0.1;g.pulse+=dt*0.08;
      if(g.phase!=='playing'){re();return;}
      if(g.inv>0)g.inv-=dt;
      if(g.hitFlash>0)g.hitFlash-=2;
      if(g.slowed>0)g.slowed-=dt;
      if(g.shield){g.shieldT-=dt;if(g.shieldT<=0)g.shield=false;}
      if(g.zoneAnn){g.zoneAnn.t-=dt;if(g.zoneAnn.t<=0)g.zoneAnn=null;}
      // Smooth bg blend between zones
      if(g.zoneBlend<1)g.zoneBlend=Math.min(1,g.zoneBlend+dt/1200);

      // Player
      const fs=g.slowed>0?0.07:0.17;
      const px0=g.px;
      g.px+=(g.tx-g.px)*fs*(dt/16);
      const py0=g.py;
      g.py+=(g.ty-g.py)*fs*(dt/16);
      const rawVx=g.px-px0;
      g.pvx=lerp(g.pvx||0,rawVx,clamp(0.12*(dt/16),0,1));
      // Skin trail particles
      const skTrail=(equippedRef.current&&getSkin(equippedRef.current).trail)||null;
      if(skTrail){
        const speed=Math.abs(rawVx)+Math.abs(g.py-py0);
        const rate=0.5+Math.min(speed*0.1,1.5);
        if(Math.random()<rate*(dt/100)){
          g.trail.push({x:g.px+(Math.random()-0.5)*10,y:g.py+(Math.random()-0.5)*10+8,life:35,ml:35,type:skTrail,seed:Math.random()*100,vy:0.3+Math.random()*0.4});
        }
      }
      g.trail=g.trail.filter(p=>p.life>0).map(p=>{p.life-=dt/16;p.y+=p.vy*(dt/16);return p;});

      // Scroll
      const zd=effZD(g);
      const fz=clamp(g.tiz/(zd.dur===999?60:zd.dur),0,1);
      g.bg=(g.bg+lerp(zd.scr[0],zd.scr[1],fz)*(dt/16))%GH;
      g.tiz+=dt/1000;
      g.playT+=dt;

      // Wave/rest — shorter rests
      g.waveT+=dt;
      if(g.waveOn&&g.waveT>=g.waveDur){g.waveOn=false;g.waveT=0;g.restDur=800+Math.random()*1200;}
      else if(!g.waveOn&&g.waveT>=g.restDur){g.waveOn=true;g.waveT=0;g.waveDur=4000+Math.random()*3500;}

      // Individual enemy spawn
      if(g.waveOn){
        g.spawnT+=dt;
        const ms=lerp(zd.ms[0],zd.ms[1],fz);
        while(g.spawnT>=ms){g.spawnT-=ms;spawnOne(g,zd,fz);}
      }
      if(!g.shield&&g.helmets.length<2&&Math.random()<0.00007*dt)
        g.helmets.push({x:POX+30+Math.random()*(PW-60),y:-45,pulse:0,id:uid(),hspd:1.035});

      // Move top→bottom enemies
      g.mucus=g.mucus.filter(m=>m.y<GH+70).map(m=>{m.y+=m.spd*(dt/16);m.x=clamp(m.x,POX+28,POX+PW-28);m.pulse+=dt*0.07;return m;});
      g.wbcs=g.wbcs.filter(w=>w.y<GH+70).map(w=>{
        w.y+=w.spd*(dt/16);w.x=clamp(w.x+(g.px-w.x)*w.hom*(dt/16),POX+28,POX+PW-28);w.pulse+=dt*0.08;return w;
      });
      g.abs=g.abs.filter(a=>a.y<GH+70).map(a=>{

              <div style={{marginTop:16,borderRadius:14,padding:'14px',textAlign:'center',background:'rgba(255,255,255,0.04)',border:'1px solid rgba(220,160,120,0.15)'}}>
                <div style={{fontSize:10.5,letterSpacing:1.8,color:'rgba(215,180,140,0.55)'}}>PARTIES JOUÉES</div>
                <div style={{fontSize:34,fontWeight:800,color:P.skin1,marginTop:4}}>{stats.games}</div>
              </div>
              <div style={{display:'flex',gap:10,marginTop:10}}>
                <div style={{flex:1,borderRadius:14,padding:'12px 8px',textAlign:'center',background:'rgba(245,200,66,0.06)',border:'1px solid rgba(245,200,66,0.2)'}}>
                  <div style={{fontSize:10,letterSpacing:1.8,color:'rgba(245,200,100,0.6)'}}>VICTOIRES</div>
                  <div style={{fontSize:28,fontWeight:800,color:P.gold,marginTop:4}}>{stats.wins}</div>
                  <div style={{fontSize:10,color:'rgba(245,200,100,0.5)',marginTop:2}}>{stats.games>0?Math.round(stats.wins/stats.games*100):0}% de réussite</div>
                </div>
                <div style={{flex:1,borderRadius:14,padding:'12px 8px',textAlign:'center',background:'rgba(232,113,138,0.06)',border:'1px solid rgba(232,113,138,0.2)'}}>
                  <div style={{fontSize:10,letterSpacing:1.8,color:'rgba(232,140,160,0.6)'}}>RIVAUX ÉLIMINÉS</div>
                  <div style={{fontSize:28,fontWeight:800,color:P.rose,marginTop:4}}>{stats.rivals}</div>
                  <div style={{fontSize:10,color:'rgba(232,140,160,0.5)',marginTop:2}}>total cumulé</div>
                </div>
              </div>
              <div style={{fontSize:13,fontWeight:700,letterSpacing:1.5,color:'rgba(245,200,66,0.85)',marginTop:18,marginBottom:6}}>TEMPS DE JEU</div>
              <div style={{borderRadius:12,padding:'10px 14px',background:'rgba(255,255,255,0.04)',border:'1px solid rgba(220,160,120,0.12)',marginBottom:8}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                  <div>
                    <div style={{fontSize:10,letterSpacing:1.5,color:'rgba(215,180,140,0.55)'}}>MODE NORMAL</div>
                    <div style={{fontSize:20,fontWeight:700,color:P.skin1,marginTop:4}}>{fmtDuration(stats.timeNorm)}</div>
                  </div>
                  <div style={{fontSize:22}}>🥚</div>
                </div>
              </div>
              <div style={{borderRadius:12,padding:'10px 14px',background:'rgba(245,200,66,0.05)',border:'1px solid rgba(245,200,66,0.2)'}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                  <div>
                    <div style={{fontSize:10,letterSpacing:1.5,color:'rgba(245,200,100,0.6)'}}>MODE INFINI ∞</div>
                    <div style={{fontSize:20,fontWeight:700,color:P.gold,marginTop:4}}>{fmtDuration(stats.timeInf)}</div>
                  </div>
                  <div style={{fontSize:22,fontWeight:800,color:P.gold}}>∞</div>
                </div>
              </div>
              <div style={{borderTop:'1px solid rgba(220,160,120,0.15)',marginTop:12,paddingTop:10,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <div style={{fontSize:11,letterSpacing:1.5,color:'rgba(215,180,140,0.45)'}}>TEMPS TOTAL</div>
                <div style={{fontSize:14,fontWeight:700,color:'rgba(230,200,180,0.85)'}}>{fmtDuration(stats.timeNorm+stats.timeInf)}</div>
              </div>
              <div style={{textAlign:'center',marginTop:14,fontSize:11,fontStyle:'italic',color:'rgba(220,170,140,0.4)'}}>Stats sauvegardées localement</div>
              <div style={{height:20}}></div>
            </div>
          </div>
        </div>
      )}
      {/* Info overlay — HTML outside SVG */}
      {showInfo&&(
        <div onClick={()=>setShowInfo(false)} style={{position:'absolute',inset:0,background:'rgba(8,2,8,0.94)',zIndex:10}}>
          <div className="modal-wrap" style={{color:'white',fontFamily:'Helvetica Neue,Arial'}}>
            <div style={{textAlign:'center'}}>
              <div style={{fontSize:28,fontWeight:800,color:P.skin1}}>Règles du jeu</div>
              <div style={{fontSize:11,letterSpacing:2,color:'rgba(210,170,140,0.5)',marginTop:4}}>TAP N'IMPORTE OÙ POUR FERMER</div>
            </div>
            <div className="ach-scroll" style={{flex:1,overflowY:'auto',padding:'0 4px 30px',touchAction:'pan-y',WebkitOverflowScrolling:'touch'}}>
              <div style={{marginTop:14}}>
                <div style={{fontSize:13,fontWeight:700,letterSpacing:1.5,color:'rgba(245,200,66,0.85)',marginBottom:6}}>OBJECTIF</div>
                <div style={{fontSize:13,color:'rgba(230,200,180,0.85)'}}>Atteins l'ovule en premier —</div>
                <div style={{fontSize:13,color:'rgba(230,200,180,0.85)'}}>tu joues le sperm blanc.</div>
              </div>
              <div style={{marginTop:14}}>
                <div style={{fontSize:13,fontWeight:700,letterSpacing:1.5,color:'rgba(245,200,66,0.85)',marginBottom:6}}>COMMANDES</div>
                <div style={{fontSize:13,color:'rgba(230,200,180,0.85)'}}>Glisse ton doigt pour naviguer</div>
                <div style={{fontSize:13,color:'rgba(230,200,180,0.85)'}}>librement dans le canal.</div>
              </div>
              <div style={{marginTop:14}}>
                <div style={{fontSize:13,fontWeight:700,letterSpacing:1.5,color:'rgba(245,200,66,0.85)',marginBottom:8}}>ENNEMIS</div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
                  <div style={{display:'flex',alignItems:'center',gap:8}}>
                    <svg viewBox="-18 -14 36 28" style={{width:36,height:28,flexShrink:0,display:'block'}}>
                      <ellipse cx="0" cy="0" rx="14" ry="11" fill="rgba(160,210,35,0.5)" stroke="rgba(120,185,15,0.7)" strokeWidth="1.4"/>
                    </svg>
                    <div><div style={{fontSize:12,fontWeight:600,color:'rgba(230,200,180,0.85)'}}>Mucus</div><div style={{fontSize:10,color:'rgba(190,160,140,0.55)'}}>te ralentit</div></div>
                  </div>
                  <div style={{display:'flex',alignItems:'center',gap:8}}>
                    <svg viewBox="-16 -14 32 28" style={{width:36,height:28,flexShrink:0,display:'block'}}>
                      <circle cx="0" cy="0" r="12" fill="#e89870"/>
                      <ellipse cx="-3.5" cy="-2" rx="3.5" ry="3.5" fill="white"/>
                      <ellipse cx="3.5" cy="-2" rx="3.5" ry="3.5" fill="white"/>
                      <circle cx="-3.5" cy="-2" r="2.2" fill="#b03050"/>
                      <circle cx="3.5" cy="-2" r="2.2" fill="#b03050"/>
                    </svg>
                    <div><div style={{fontSize:12,fontWeight:600,color:'rgba(230,200,180,0.85)'}}>Rivaux</div><div style={{fontSize:10,color:'rgba(190,160,140,0.55)'}}>percute avant le haut !</div></div>
                  </div>
                  <div style={{display:'flex',alignItems:'center',gap:8}}>
                    <svg viewBox="-18 -18 36 36" style={{width:36,height:36,flexShrink:0,display:'block'}}>
                      {[0,1,2,3,4,5,6,7].map(i=>{const a=i/8*Math.PI*2;return<circle key={i} cx={Math.cos(a)*9} cy={Math.sin(a)*9} r="4" fill="#d4eaf7"/>;})}
                      <circle cx="0" cy="0" r="10" fill="#f0f8ff"/>
                      <ellipse cx="1.5" cy="1" rx="5" ry="3.5" fill="#c5dff0" transform="rotate(-25,1.5,1)"/>
                    </svg>
                    <div><div style={{fontSize:12,fontWeight:600,color:'rgba(230,200,180,0.85)'}}>Globule blanc</div><div style={{fontSize:10,color:'rgba(190,160,140,0.55)'}}>évite ! — 1 vie</div></div>
                  </div>
                  <div style={{display:'flex',alignItems:'center',gap:8}}>
                    <svg viewBox="-14 -14 28 28" style={{width:36,height:36,flexShrink:0,display:'block'}}>
                      <line x1="0" y1="0" x2="0" y2="10" stroke="#6090e0" strokeWidth="2.5" strokeLinecap="round"/>
                      <line x1="0" y1="0" x2="-8" y2="-8" stroke="#6090e0" strokeWidth="2.5" strokeLinecap="round"/>
                      <line x1="0" y1="0" x2="8" y2="-8" stroke="#6090e0" strokeWidth="2.5" strokeLinecap="round"/>
                      <circle cx="-8" cy="-8" r="3" fill="#2848cc"/>
                      <circle cx="8" cy="-8" r="3" fill="#2848cc"/>
                      <circle cx="0" cy="10" r="3" fill="#2848cc"/>
                    </svg>
                    <div><div style={{fontSize:12,fontWeight:600,color:'rgba(230,200,180,0.85)'}}>Anticorps</div><div style={{fontSize:10,color:'rgba(190,160,140,0.55)'}}>évite ! — 1 vie</div></div>
                  </div>
                </div>
              </div>
              <div style={{marginTop:14}}>
                <div style={{fontSize:13,fontWeight:700,letterSpacing:1.5,color:'rgba(245,200,66,0.85)',marginBottom:8}}>BONUS</div>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <svg viewBox="-14 -18 28 26" style={{width:36,height:32,flexShrink:0,display:'block'}}>
                    <path d="M -10 2 Q -12 -11 0 -15 Q 12 -11 10 2 Z" fill="#d49018" stroke="#a06808" strokeWidth="1.2"/>
                    <ellipse cx="0" cy="-11" rx="7" ry="4" fill="#f0b030"/>
                    <path d="M -9 0 Q -7 5 0 5 Q 7 5 9 0" fill="rgba(200,230,255,0.4)"/>
                  </svg>
                  <div><div style={{fontSize:12,fontWeight:600,color:'rgba(230,200,180,0.85)'}}>Casque</div><div style={{fontSize:10,color:'rgba(190,160,140,0.55)'}}>bouclier 8s</div></div>
                </div>
              </div>
              <div style={{marginTop:14}}>
                <div style={{fontSize:13,fontWeight:700,letterSpacing:1.5,color:'rgba(245,200,66,0.85)',marginBottom:6}}>5 ZONES À TRAVERSER</div>
                {ZONES.map((zo,i)=>(
                  <div key={i} style={{display:'flex',alignItems:'center',gap:8,marginBottom:4,fontSize:13}}>
                    <span>{zo.emoji}</span>
                    <span style={{color:'rgba(220,190,170,0.8)'}}>{zo.name}</span>
                  </div>
                ))}
              </div>
              <div style={{textAlign:'center',marginTop:14,fontSize:11,fontStyle:'italic',color:'rgba(245,200,66,0.65)'}}>Gagne une fois pour débloquer le ∞ Mode Infini</div>
              <div style={{height:20}}></div>
            </div>
          </div>
        </div>
      )}
      {/* Achievements overlay — HTML outside SVG, même pattern que le shop */}
      {showAch&&(
        <div onClick={()=>setShowAch(false)} style={{position:'absolute',inset:0,background:'rgba(8,2,8,0.96)',zIndex:10}}>
          <div className="modal-wrap" style={{color:'white',fontFamily:'Helvetica Neue,Arial'}}>
          <div style={{fontSize:'26px',fontWeight:800,color:P.skin1,textAlign:'center'}}>Récompenses</div>
          <div style={{fontSize:'10.5px',letterSpacing:'2px',color:'rgba(210,170,140,0.5)',textAlign:'center',marginTop:'4px'}}>TAP N'IMPORTE OÙ POUR FERMER</div>
          <div style={{margin:'8px auto 6px',background:'rgba(232,113,138,0.08)',border:'1px solid rgba(232,113,138,0.3)',borderRadius:14,padding:'6px 24px',textAlign:'center'}}>
            <div style={{fontSize:9,letterSpacing:2,color:'rgba(232,140,160,0.65)'}}>RÉSERVE COLLECTÉE</div>
            <div style={{fontSize:20,fontWeight:800,color:P.rose,marginTop:2}}>{mL.toLocaleString('fr')} mL</div>
          </div>
          <div style={{fontSize:11,color:'rgba(220,190,170,0.7)',textAlign:'center',marginBottom:8}}>{achSet.size} / {ACHIEVEMENTS.length} débloquées</div>
          <div className="ach-scroll" style={{flex:1,overflowY:'auto',padding:'0 8px 30px',touchAction:'pan-y',WebkitOverflowScrolling:'touch'}}>
            {['easy','medium','hard','extreme'].map(tier=>(
              <div key={tier} style={{marginBottom:10}}>
                <div style={{fontSize:10,letterSpacing:2,fontWeight:700,color:TIERS[tier].color,padding:'8px 4px 4px'}}>{TIERS[tier].label.toUpperCase()}</div>
                {ACHIEVEMENTS.filter(a=>a.tier===tier).map(a=>{
                  const unlocked=achSet.has(a.id);
                  const sExt={...stats,bestInfTime:highScoresInf[0]?.time||0};
                  const val=a.get(sExt)||0;
                  const tgt=a.target;
                  let pct=unlocked?1:clamp(val/tgt,0,1);
                  let progressTxt;
                  if(unlocked){progressTxt='Débloqué';}
                  else if(a.fmt==='time'){progressTxt=fmtDuration(val)+' / '+fmtDuration(tgt);}
                  else if(a.fmt==='speed'){
                    progressTxt=sExt.bestWinTime>0?('Record : '+fmtTime(sExt.bestWinTime)+' / '+fmtTime(tgt)):('Cible : '+fmtTime(tgt));
                    pct=sExt.bestWinTime>0?clamp(tgt/sExt.bestWinTime,0,1):0;
                  }
                  else{progressTxt=val+' / '+tgt;}
                  return(
                    <div key={a.id} style={{padding:'8px 10px',marginBottom:5,borderRadius:10,background:unlocked?'rgba(245,200,66,0.08)':'rgba(255,255,255,0.025)',border:`1px solid ${unlocked?'rgba(245,200,66,0.3)':'rgba(220,160,120,0.08)'}`}}>
                      <div style={{display:'flex',alignItems:'flex-start'}}>
                        <div style={{width:28,height:28,borderRadius:'50%',background:unlocked?TIERS[tier].color:'rgba(255,255,255,0.05)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,marginRight:10,color:unlocked?'white':'rgba(255,255,255,0.3)',flexShrink:0}}>{unlocked?'✓':'·'}</div>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontSize:13,fontWeight:600,color:unlocked?'rgba(230,200,180,0.95)':'rgba(180,150,130,0.5)'}}>{a.name}</div>
                          <div style={{fontSize:10,color:unlocked?'rgba(190,160,140,0.6)':'rgba(150,125,110,0.4)',marginTop:2}}>{a.desc}</div>
                        </div>
                        <div style={{fontSize:12,fontWeight:700,color:unlocked?P.rose:'rgba(180,140,140,0.35)',whiteSpace:'nowrap',marginLeft:8,marginTop:2,flexShrink:0}}>+{a.ml} mL</div>
                      </div>
                      <div style={{marginTop:7,marginLeft:38}}>
                        <div style={{height:4,background:'rgba(255,255,255,0.06)',borderRadius:2,overflow:'hidden'}}>
                          <div style={{height:'100%',width:(pct*100)+'%',background:unlocked?'#7ec88a':TIERS[tier].color,borderRadius:2,transition:'width .3s'}}></div>
                        </div>
                        <div style={{fontSize:9.5,color:'rgba(180,150,130,0.5)',marginTop:3}}>{progressTxt}</div>
                      </div>
                    </div>
                  );
                })}
              </div>
            ))}
            <div style={{height:20}}></div>
          </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Game/>);
</script>
</body>

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
</script>
